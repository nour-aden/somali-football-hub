html { -webkit-text-size-adjust: 100%; }
body { margin: 0; padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-tap-highlight-color: transparent; }
:root {

  --blue: #1b3b9c; --blue-soft: #e4eafb; --yellow: #f5b820; --yellow-ink: #1a1500;

* { box-sizing: border-box; }

p { margin: 0; }
button, input { font: inherit; color: inherit; }
button { touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }

.muted { color: var(--muted); }

.top { position: sticky; top: 0; z-index: 20; padding-top: env(safe-area-inset-top, 0px); background: var(--head-bg); color: var(--head-fg); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; min-width: 0; }
.brand img { width: 34px; height: 34px; border-radius: 9px; flex: none; }
.brand small { display: block; font-family: var(--font-body); font-weight: 600; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--yellow); }
.top-right { display: flex; align-items: center; gap: 8px; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600; color: var(--head-muted); }
.live i { width: 9px; height: 9px; border-radius: 50%; background: #8791ad; display: block; }
.live[data-s="live"] i { background: #3ddc97; }
.live[data-s="reconnecting"] i { background: var(--yellow); }
.live[data-s="offline"] i { background: #ff6b60; }
.bell { position: relative; width: 44px; height: 44px; border: 0; border-radius: 12px; background: rgba(255,255,255,.1); color: var(--head-fg); display: grid; place-items: center; cursor: pointer; }
.bell svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.badge { position: absolute; top: 2px; right: 2px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--yellow); color: var(--yellow-ink); font-size: .75rem; font-weight: 800; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.netbar { background: var(--yellow); color: var(--yellow-ink); font-weight: 600; font-size: .88rem; text-align: center; padding: 7px 16px; }

.toasts { position: fixed; z-index: 40; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 64px); display: grid; gap: 8px; justify-items: center; pointer-events: none;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }

.toast b { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
.toast span { font-weight: 600; overflow-wrap: anywhere; }
.toast.plain { background: var(--surface); color: var(--fg); border: 1px solid var(--line); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 12px; border: 0; font-weight: 600; cursor: pointer; }
.btn-primary { background: var(--yellow); color: var(--yellow-ink); }
.btn-ghost { background: transparent; border: 2px solid var(--line); color: var(--blue); }
.btn-danger { background: var(--bad-soft); color: var(--bad); border: 2px solid var(--bad); }
.btn[disabled] { opacity: .6; cursor: progress; }
.btn-block { width: 100%; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; min-width: 0; }
.err { color: var(--bad); font-size: .9rem; }
.err:empty { display: none; }

#view-login .wrap { padding-block: 28px; display: grid; gap: 16px; max-width: 440px; }
#view-login h1 { font-size: 1.7rem; }
form { display: grid; gap: 14px; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 600; font-size: .92rem; }

#view-app .wrap { padding-block: 14px 40px; display: grid; gap: 14px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }

.link { border: 0; background: transparent; color: var(--blue); font-weight: 600; min-height: 40px; padding: 0 10px; border-radius: 10px; cursor: pointer; }
.push h2 { font-size: 1.05rem; }
.push .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

.tabs button { min-height: 56px; min-width: 0; border: 0; background: transparent; border-radius: 10px; cursor: pointer; display: grid; place-items: center; align-content: center; gap: 0; color: var(--muted); font-weight: 600; font-size: .8rem; padding: 4px 2px; }
.tabs button strong { font-family: var(--font-display); font-size: 1.15rem; color: var(--fg); font-variant-numeric: tabular-nums; line-height: 1.1; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(10,20,60,.15); }

.list { display: grid; gap: 10px; }
.empty { text-align: center; padding: 36px 12px; color: var(--muted); }
.bk { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; cursor: pointer; display: grid; gap: 4px; min-width: 0; position: relative; }
.bk.unseen { border-color: var(--yellow); box-shadow: inset 4px 0 0 var(--yellow); }
.bk .l1 { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.svc { font-weight: 800; font-family: var(--font-display); }
.ref { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; }
.bk .nm { font-weight: 600; overflow-wrap: anywhere; }
.bk .rt { color: var(--muted); font-size: .92rem; overflow-wrap: anywhere; }
.bk .l3 { display: flex; justify-content: space-between; gap: 10px; font-size: .88rem; color: var(--muted); font-variant-numeric: tabular-nums; }

<header class="top">
  <div class="wrap">
    <div class="brand">
      <img src="icons/admin-192.png" alt="" width="34" height="34">
      <div><span>Jigjiga Bajaj</span><small data-i18n="adminTag"></small></div>
    </div>
    <div class="top-right" id="topRight" hidden>

      <button class="bell" type="button" id="bell" data-i18n-aria="bellLabel">

        <span class="badge" id="badge" hidden>0</span>
      </button>
    </div>
  </div>
  <div class="netbar" id="netBar" role="status" hidden data-i18n="offlineBar"></div>
</header>

<div class="toasts" id="toasts" aria-live="polite"></div>

<section id="view-login" hidden>
  <div class="wrap">
    <div>
      <h1 data-i18n="loginTitle"></h1>
      <p class="muted" data-i18n="loginSub"></p>
    </div>
    <form class="card" id="loginForm" novalidate>
      <div class="field">
        <label for="email" data-i18n="email"></label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>
      <div class="field">
        <label for="password" data-i18n="password"></label>
        <input id="password" name="password" type="password" autocomplete="current-password">
      </div>
      <p class="err" id="loginErr" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit" id="loginBtn" data-i18n="signIn"></button>
    </form>
    <div class="seg" style="justify-self:start" role="group" aria-label="Language / Luqad">
      <button type="button" data-lang="en" aria-pressed="true" lang="en">EN</button>
      <button type="button" data-lang="so" aria-pressed="false" lang="so">SO</button>
    </div>
  </div>
</section>

<section id="view-app" hidden>
  <div class="wrap">
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Language / Luqad">
        <button type="button" data-lang="en" aria-pressed="true" lang="en">EN</button>
        <button type="button" data-lang="so" aria-pressed="false" lang="so">SO</button>
      </div>
      <div>
        <button class="link" type="button" id="soundBtn"></button>
        <button class="link" type="button" id="refreshBtn" data-i18n="refresh"></button>
        <button class="link" type="button" id="signOutBtn" data-i18n="signOut"></button>
      </div>
    </div>

    <div class="card push" id="pushCard">
      <h2 data-i18n="pushTitle"></h2>
      <p class="muted" id="pushMsg"></p>
      <div class="row" id="pushRow"></div>
    </div>

    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="list" id="list" role="tabpanel"></div>
  </div>
</section>

<div class="sheet" id="sheet" hidden>
  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1"></div>
</div>

    state.tab = b.getAttribute("data-tab"); renderAll();
  });
  $("list").addEventListener("click", function (ev) {
    var b = ev.target.closest(".bk"); if (b) openSheet(b.getAttribute("data-id"));
  });
  $("bell").addEventListener("click", function () { state.tab = "new"; renderAll(); window.scrollTo(0, 0); });
  $("sheet").addEventListener("click", function (ev) { if (ev.target === $("sheet") || ev.target.closest("#sheetClose")) closeSheet(); });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && !$("sheet").hidden) closeSheet(); });
  $("signOutBtn").addEventListener("click", function () { signOut(false); });
  $("refreshBtn").addEventListener("click", function () { load(false); });
  $("soundBtn").addEventListener("click", function () {
    soundOn = !soundOn; try { localStorage.setItem("jb-sound", soundOn ? "on" : "off"); } catch (e) {}
    $("soundBtn").textContent = t(soundOn ? "soundOn" : "soundOff"); if (soundOn) beep();
  });

  function netState() { $("netBar").hidden = navigator.onLine !== false; }
  window.addEventListener("offline", function () { netState(); if (state.session) setLive("offline"); });
  window.addEventListener("online", function () {
    netState();
    if (state.session) { state.retry = 0; if (state.retryTimer) { clearTimeout(state.retryTimer); state.retryTimer = null; } setLive("reconnecting"); subscribe(); }
  });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden || !state.session) return;
    load(true);
    if (state.live !== "live" && navigator.onLine !== false) subscribe();
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(function () {}); });
    navigator.serviceWorker.addEventListener("message", function (ev) {
      if (ev.data && ev.data.type === "open-booking") {
        load(true).then(function () { if (ev.data.id && state.byId[ev.data.id]) openSheet(ev.data.id); });
      }
    });
  }

  applyText(); netState();
  if (!window.supabase || !window.supabase.createClient) { showLogin(t("errLib")); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: "jb-admin-auth" }
  });
  sb.auth.onAuthStateChange(function (event) {
    if (event === "SIGNED_OUT" && state.session) setTimeout(function () { signOut(true); }, 0);
  });
  sb.auth.getSession().then(function (r) {
    if (r.data && r.data.session) enterApp(r.data.session); else showLogin();
  }, function () { showLogin(t("errGeneric")); });
})();
</script>
</body>
</html>
