<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jebena Coffee Works | Small-batch roasters in Addis Ababa</title>
  <meta name="description" content="Single-origin Ethiopian coffee, roasted in small batches in Addis Ababa and delivered fresh. Shop this week's coffees, subscribe, or visit the roastery.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&family=Noto+Sans+Ethiopic:wght@600;800&display=swap" rel="stylesheet">
  <style>
    /* Jebena Coffee Works
       Palette comes from the coffee itself: green bean, roasted bean, ripe cherry, and the gold of a first-crack marker. */

    :root {
      --bean: #e3e8d2;
      --bean-deep: #d2dabb;
      --roast: #2a1a12;
      --roast-soft: #5a4a3f;
      --cherry: #b02a30;
      --cherry-dark: #8f1f25;
      --gold: #d9a23a;

      --font-display: "Bricolage Grotesque", "Noto Sans Ethiopic", system-ui, sans-serif;
      --font-body: "Newsreader", Georgia, "Noto Sans Ethiopic", serif;

      --gutter: clamp(1.25rem, 4vw, 2.5rem);
      --max: 1180px;
      --space-section: clamp(4rem, 9vw, 7.5rem);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bean);
      color: var(--roast);
      font-family: var(--font-body);
      font-size: 1.125rem;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    img, svg { display: block; max-width: 100%; }

    a { color: inherit; }

    .wrap {
      width: 100%;
      max-width: var(--max);
      margin-inline: auto;
      padding-inline: var(--gutter);
    }

    .sr {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .skip {
      position: absolute;
      left: 1rem; top: -4rem;
      padding: .6rem 1rem;
      background: var(--roast);
      color: var(--bean);
      z-index: 10;
    }
    .skip:focus { top: 1rem; }

    :focus-visible {
      outline: 3px solid var(--cherry);
      outline-offset: 3px;
    }
    .dark :focus-visible { outline-color: var(--gold); }

    /* Type */
    h1, h2, h3, .brand-name, .btn, th, .nav a, .order-link {
      font-family: var(--font-display);
    }

    h1, h2, h3 { margin: 0; line-height: 1.02; letter-spacing: -0.02em; }

    h1 {
      font-size: clamp(2.8rem, 7.4vw, 5.4rem);
      font-weight: 800;
      font-stretch: 78%;
      font-variation-settings: "wdth" 78;
      max-width: 11ch;
    }

    h2 {
      font-size: clamp(2rem, 4.4vw, 3.2rem);
      font-weight: 700;
      font-variation-settings: "wdth" 82;
    }

    h3 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    p { margin: 0 0 1em; max-width: 62ch; }

    .lead {
      font-size: 1.3rem;
      line-height: 1.55;
      max-width: 34em;
    }

    /* Header */
    .site-header { padding-block: 1.1rem; }

    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem 2rem;
      flex-wrap: wrap;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: .7rem;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 2.6rem; height: 2.6rem;
      border-radius: 50%;
      background: var(--roast);
      color: var(--bean);
      font-family: "Noto Sans Ethiopic", sans-serif;
      font-weight: 800;
      font-size: 1rem;
      line-height: 1;
    }

    .brand-name {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.01em;
    }

    .nav {
      display: flex;
      gap: 1.6rem;
      list-style: none;
      margin: 0; padding: 0;
    }

    .nav a {
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      padding-block: .3rem;
      border-bottom: 2px solid transparent;
    }
    .nav a:hover { border-bottom-color: var(--cherry); }

    .order-link {
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      padding: .5rem .9rem;
      border: 2px solid var(--roast);
      border-radius: 999px;
    }
    .order-link:hover { background: var(--roast); color: var(--bean); }

    /* Buttons */
    .btn {
      display: inline-block;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.005em;
      text-decoration: none;
      padding: .85rem 1.4rem;
      border: 2px solid var(--roast);
      border-radius: 999px;
      background: transparent;
      color: var(--roast);
      cursor: pointer;
    }

    .btn-primary {
      background: var(--cherry);
      border-color: var(--cherry);
      color: var(--bean);
    }
    .btn-primary:hover { background: var(--cherry-dark); border-color: var(--cherry-dark); }

    .btn-ghost:hover { background: var(--roast); color: var(--bean); }

    .btn-add {
      padding: .5rem 1rem;
      font-size: .95rem;
      white-space: nowrap;
    }
    .btn-add:hover { background: var(--roast); color: var(--bean); }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: .8rem;
      margin-top: 2rem;
    }

    /* Hero */
    .hero { padding-block: clamp(2rem, 6vw, 4.5rem) var(--space-section); }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
      gap: clamp(2rem, 5vw, 4rem);
      align-items: center;
    }

    .hero-copy .lead { margin-top: 1.6rem; margin-bottom: 0; }

    .curve { margin: 0; }

    .curve svg {
      width: 100%;
      height: auto;
      background: var(--bean-deep);
      border-radius: 1.25rem;
      padding: .5rem;
    }

    .curve figcaption {
      margin-top: .8rem;
      font-size: .98rem;
      font-style: italic;
      color: var(--roast-soft);
    }

    .curve .grid line { stroke: var(--roast); stroke-opacity: .14; stroke-width: 1; }
    .curve .grid .axis { stroke-opacity: .5; }

    .curve .ticks text {
      font-family: var(--font-display);
      font-size: 12px;
      fill: var(--roast-soft);
    }

    .curve .roast-line {
      fill: none;
      stroke: var(--cherry);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 0;
    }

    .curve .marks circle { fill: var(--roast); }
    .curve .marks .crack { fill: var(--gold); stroke: var(--roast); stroke-width: 2.5; }

    .curve .notes text {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 600;
      fill: var(--roast);
    }

    /* The one orchestrated moment: the curve draws itself once */
    @media (prefers-reduced-motion: no-preference) {
      .curve .roast-line {
        stroke-dashoffset: 1;
        animation: draw 3.2s cubic-bezier(.45, .1, .25, 1) .3s forwards;
      }
      .curve .marks circle,
      .curve .notes text {
        opacity: 0;
        animation: appear .5s ease forwards;
      }
      .curve .marks circle:nth-child(1), .curve .notes text:nth-child(1) { animation-delay: .3s; }
      .curve .marks circle:nth-child(2), .curve .notes text:nth-child(2) { animation-delay: 1.0s; }
      .curve .marks circle:nth-child(3), .curve .notes text:nth-child(3) { animation-delay: 2.6s; }
      .curve .marks circle:nth-child(4), .curve .notes text:nth-child(4) { animation-delay: 3.3s; }
    }

    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes appear { to { opacity: 1; } }

    /* Sections */
    .section { padding-block: var(--space-section); }

    .section-head { margin-bottom: clamp(2rem, 4vw, 3rem); }
    .section-head h2 { margin-bottom: 1rem; }
    .section-head p { margin-bottom: 0; color: var(--roast-soft); }
    .dark .section-head p { color: #c9d0b6; }

    .dark {
      background: var(--roast);
      color: var(--bean);
    }

    /* Coffees table */
    .spec {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .spec th, .spec td {
      padding: 1.2rem 1rem 1.2rem 0;
      vertical-align: baseline;
      border-top: 1px solid rgba(42, 26, 18, .28);
    }

    .spec thead th {
      padding-block: .6rem;
      font-size: .95rem;
      font-weight: 600;
      color: var(--roast-soft);
      border-top: 0;
      border-bottom: 2px solid var(--roast);
    }

    .spec tbody th {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .spec .sub {
      display: block;
      margin-top: .15rem;
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 400;
      font-style: italic;
      letter-spacing: 0;
      color: var(--roast-soft);
    }

    .spec .price {
      font-family: var(--font-display);
      font-weight: 700;
      white-space: nowrap;
    }

    .spec .act { text-align: right; padding-right: 0; }

    .spec tbody tr:last-child th,
    .spec tbody tr:last-child td { border-bottom: 1px solid rgba(42, 26, 18, .28); }

    .status {
      min-height: 1.6em;
      margin: 1.2rem 0 0;
      color: var(--cherry);
      font-weight: 600;
    }

    /* Roasting steps */
    .steps {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0;
      border-top: 2px solid var(--gold);
    }

    .steps li {
      position: relative;
      padding: 1.6rem 1.5rem 0 0;
    }

    .steps li::before {
      content: "";
      position: absolute;
      top: -8px; left: 0;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--gold);
    }

    .steps .time {
      display: block;
      margin-bottom: .6rem;
      font-family: var(--font-display);
      font-size: 2.4rem;
      font-weight: 800;
      font-variation-settings: "wdth" 80;
      letter-spacing: -0.03em;
      color: var(--gold);
      line-height: 1;
    }

    .steps h3 { margin-bottom: .5rem; }
    .steps p { margin: 0; color: #c9d0b6; font-size: 1.05rem; }

    /* Subscribe */
    .split {
      display: grid;
      grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
      gap: clamp(2rem, 5vw, 4rem);
      align-items: start;
    }

    .split .section-head { margin-bottom: 0; }

    .plans fieldset {
      margin: 0 0 1.6rem;
      padding: 0;
      border: 0;
    }

    .plans legend {
      padding: 0;
      margin-bottom: .8rem;
      font-family: var(--font-display);
      font-size: .95rem;
      font-weight: 600;
      color: var(--roast-soft);
    }

    .plan {
      display: grid;
      grid-template-columns: auto 1fr auto;
      grid-template-areas:
        "radio name price"
        "radio note price";
      column-gap: 1rem;
      align-items: center;
      padding: 1.1rem 1.2rem;
      border: 2px solid rgba(42, 26, 18, .3);
      border-radius: 1rem;
      cursor: pointer;
    }
    .plan + .plan { margin-top: .7rem; }

    .plan input {
      grid-area: radio;
      width: 1.25rem; height: 1.25rem;
      margin: 0;
      accent-color: var(--cherry);
    }

    .plan-name {
      grid-area: name;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.15rem;
      line-height: 1.2;
    }

    .plan-note {
      grid-area: note;
      font-size: .98rem;
      font-style: italic;
      color: var(--roast-soft);
      line-height: 1.3;
    }

    .plan-price {
      grid-area: price;
      font-family: var(--font-display);
      font-weight: 700;
      text-align: right;
    }

    .plan:has(input:checked) {
      border-color: var(--cherry);
      background: var(--bean-deep);
    }
    .plan:has(input:focus-visible) {
      outline: 3px solid var(--cherry);
      outline-offset: 3px;
    }

    /* Visit */
    .visit { background: var(--bean-deep); }

    .visit-grid {
      display: grid;
      grid-template-columns: minmax(0, 6fr) minmax(0, 5fr);
      gap: clamp(2rem, 5vw, 4rem);
      align-items: start;
    }

    .visit h2 { margin-bottom: 1.2rem; }

    .cupping {
      padding-left: 1rem;
      border-left: 4px solid var(--cherry);
    }

    address {
      font-style: normal;
      margin-top: 1.6rem;
    }

    address a { text-decoration-thickness: 1px; text-underline-offset: 3px; }
    address a:hover { color: var(--cherry); }

    .glyph {
      margin: 0 0 .4rem;
      font-family: "Noto Sans Ethiopic", sans-serif;
      font-weight: 800;
      font-size: clamp(5rem, 14vw, 9rem);
      line-height: 1;
      color: var(--cherry);
    }

    .hours table { width: 100%; border-collapse: collapse; }

    .hours th, .hours td {
      padding: .8rem 0;
      text-align: left;
      border-top: 1px solid rgba(42, 26, 18, .28);
    }
    .hours tr:last-child th, .hours tr:last-child td { border-bottom: 1px solid rgba(42, 26, 18, .28); }

    .hours th { font-size: 1.05rem; }
    .hours td { font-family: var(--font-display); font-weight: 600; text-align: right; }

    .hours .note { margin-top: 1rem; font-style: italic; color: var(--roast-soft); }

    /* Footer */
    .site-footer {
      background: var(--roast);
      color: var(--bean);
      padding-block: 3rem;
    }

    .foot p { margin: 0 0 .4rem; }
    .foot-brand { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; letter-spacing: -0.02em; }
    .foot .fine { margin-top: 1.4rem; font-size: .95rem; color: #c9d0b6; }

    /* Tablet */
    @media (max-width: 960px) {
      .hero-grid, .split, .visit-grid { grid-template-columns: minmax(0, 1fr); }
      h1 { max-width: 14ch; }
      .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 2.5rem; border-top: 0; }
      .steps li { border-top: 2px solid var(--gold); }
    }

    /* Phone: the coffee table becomes a stack of rows */
    @media (max-width: 760px) {
      .spec thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      .spec, .spec tbody, .spec tr, .spec th, .spec td { display: block; }

      .spec tr {
        padding: 1.3rem 0;
        border-top: 1px solid rgba(42, 26, 18, .28);
      }
      .spec tbody tr:last-child { border-bottom: 1px solid rgba(42, 26, 18, .28); }

      .spec th, .spec td,
      .spec tbody tr:last-child th,
      .spec tbody tr:last-child td { padding: 0; border: 0; }

      .spec td {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding-top: .45rem;
        text-align: right;
      }

      .spec td::before {
        content: attr(data-label);
        font-family: var(--font-display);
        font-size: .92rem;
        font-weight: 600;
        text-align: left;
        color: var(--roast-soft);
      }

      .spec td.act { display: block; padding-top: 1rem; text-align: left; }
      .spec td.act::before { content: none; }
    }

    @media (max-width: 560px) {
      body { font-size: 1.05rem; }
      .bar { justify-content: space-between; }
      .nav { order: 3; width: 100%; gap: 1.2rem; flex-wrap: wrap; }
      .steps { grid-template-columns: minmax(0, 1fr); }
      .plan { padding: 1rem; }
      .plan-price { font-size: .95rem; }
    }
  </style>
</head>

  <header class="site-header">
    <div class="wrap bar">
      <a class="brand" href="#top" aria-label="Jebena Coffee Works, home">
        <span class="brand-mark" lang="am" aria-hidden="true">ቡና</span>
        <span class="brand-name">Jebena Coffee Works</span>
      </a>

        <ul class="nav">
          <li><a href="#coffees">Coffees</a></li>

          <li><a href="#subscribe">Subscribe</a></li>
          <li><a href="#visit">Visit</a></li>
        </ul>
