<style>
[hidden] { display: none !important; }
body { margin: 0; }
/* Layout: one narrow column (max 560px). Blue hero band with a road-stripe edge, then cards on a blue-tinted ground. */
:root {
  --bg: #f2f5fb;
  --surface: #ffffff;
  --fg: #111c3a;
  --muted: #55627f;
  --line: #d8dfee;
  --blue: #1b3b9c;
  --blue-ink: #ffffff;
  --blue-soft: #e4eafb;
  --yellow: #f5b820;
  --yellow-ink: #1a1500;
  --good: #14744a;
  --good-soft: #dcf3e8;
  --bad: #b3261e;
  --hero-bg: #1b3b9c;
  --hero-fg: #ffffff;
  --hero-muted: #cdd8f6;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1127; --surface: #141c38; --fg: #eaeefb; --muted: #9aa7c7; --line: #26315a;
    --blue: #8fa8ff; --blue-ink: #0b1127; --blue-soft: #1c2a5c;
    --yellow: #f5b820; --yellow-ink: #1a1500;
    --good: #6ee0a6; --good-soft: #14362a; --bad: #ff8a80;
    --hero-bg: #12266b; --hero-fg: #ffffff; --hero-muted: #b9c6f0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1127; --surface: #141c38; --fg: #eaeefb; --muted: #9aa7c7; --line: #26315a;
  --blue: #8fa8ff; --blue-ink: #0b1127; --blue-soft: #1c2a5c;
  --yellow: #f5b820; --yellow-ink: #1a1500;
  --good: #6ee0a6; --good-soft: #14362a; --bad: #ff8a80;
  --hero-bg: #12266b; --hero-fg: #ffffff; --hero-muted: #b9c6f0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.1; }
p { margin: 0; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }

.wrap {
  width: 100%; max-width: 560px; margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--hero-bg); color: var(--hero-fg); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; letter-spacing: -0.01em; background: none; border: 0; padding: 0; cursor: pointer; color: inherit; min-height: 44px; }
.brand svg { width: 38px; height: auto; }
.lang { display: flex; background: rgba(255,255,255,.14); border-radius: 999px; padding: 3px; gap: 2px; }
.lang button { border: 0; background: transparent; color: var(--hero-fg); min-width: 44px; min-height: 36px; border-radius: 999px; font-weight: 600; font-size: .85rem; letter-spacing: .06em; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--yellow); color: var(--yellow-ink); }

/* Bajaj icon colours */
.bj-body { fill: var(--yellow); }
.bj-top { fill: #ffffff; }
.bj-glass { fill: #1b3b9c; }
.bj-wheel { fill: #0b1127; stroke: #ffffff; stroke-width: 2; }
.bj-hub { fill: #ffffff; }
  /* Hero */
.hero { background: var(--hero-bg); color: var(--hero-fg); position: relative; }
.hero .wrap { padding-block: 26px 44px; display: grid; gap: 16px; }
.eyebrow { font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--hero-muted); font-weight: 600; }
.hero h1 { font-size: clamp(2.6rem, 13vw, 4rem); font-weight: 800; letter-spacing: -0.03em; }
.hero h1 span { color: var(--yellow); }
.hero p.lead { color: var(--hero-muted); max-width: 44ch; font-size: 1.05rem; }
.hero .art { width: 150px; max-width: 45%; }
.road { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: #0b1533; }
.road::after { content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 3px;
  background: repeating-linear-gradient(90deg, var(--yellow) 0 22px, transparent 22px 40px); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 22px; border-radius: 14px; border: 0; font-weight: 600; font-size: 1.05rem; cursor: pointer; text-decoration: none; }
.btn-primary { background: var(--yellow); color: var(--yellow-ink); }
.btn-primary:hover { filter: brightness(1.05); }
.btn-ghost { background: transparent; color: var(--blue); border: 2px solid var(--line); }
.btn-block { width: 100%; }
.btn-row { display: grid; gap: 10px; }

/* Sections */
main { padding-block: 22px 28px; }
.stack { display: grid; gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; }
.h2 { font-size: 1.35rem; font-weight: 700; }
.sub { color: var(--muted); margin-top: 6px; }

.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--blue-soft); border-radius: 14px; padding: 4px; gap: 4px; }
.tabs button { min-height: 44px; border: 0; background: transparent; border-radius: 10px; font-weight: 600; color: var(--muted); cursor: pointer; }
.tabs button[aria-current="page"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(10,20,60,.12); }

/* Facts */
.facts { display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; }
.facts li { display: flex; align-items: center; gap: 12px; }
.dot { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; font-weight: 700; font-size: .85rem; }

/* Routes */
.routes { display: grid; gap: 10px; margin-top: 12px; }
.route { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 56px; cursor: pointer; }
.route:hover { border-color: var(--blue); }
.route .rt { min-width: 0; display: grid; gap: 2px; }
.route .rt b { font-weight: 600; overflow-wrap: anywhere; }
.route .rt small { color: var(--muted); }
.route .rp { flex: none; font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; color: var(--blue); font-variant-numeric: tabular-nums; }

/* Form */
form { display: grid; gap: 16px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-weight: 600; font-size: .92rem; }
.field input { width: 100%; min-height: 52px; padding: 0 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); font-size: 1rem; }
.field input:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--yellow) 55%, transparent); }
.field input[aria-invalid="true"] { border-color: var(--bad); }
.err { color: var(--bad); font-size: .88rem; min-height: 0; }
.err:empty { display: none; }
.places { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
.places .pair { display: grid; gap: 16px; min-width: 0; }
.swap { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); color: var(--blue); cursor: pointer; display: grid; place-items: center; align-self: center; }
.swap svg { width: 22px; height: 22px; }

/* Fare */
.fare { background: var(--blue-soft); border-radius: 14px; padding: 16px; display: grid; gap: 8px; }
.fare .lab { font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.fare .amt { font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; letter-spacing: -0.02em; color: var(--fg); font-variant-numeric: tabular-nums; line-height: 1; }
.fare .amt small { font-size: 1.1rem; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.fare .meta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: .95rem; font-variant-numeric: tabular-nums; }
.fare .meta b { color: var(--fg); font-weight: 600; }
.fare .note { color: var(--muted); }
  /* Confirmation ticket */
.ok { display: grid; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 8px; align-self: start; justify-self: start; background: var(--good-soft); color: var(--good); font-weight: 600; font-size: .88rem; padding: 6px 12px; border-radius: 999px; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: block; }
.ticket { padding: 0; overflow: hidden; }
.ticket .head { padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 2px dashed var(--line); flex-wrap: wrap; }
.ticket .ref { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.mini { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; min-height: 40px; padding: 0 14px; cursor: pointer; font-weight: 600; color: var(--blue); }
.rows { display: grid; padding: 6px 18px 12px; }
.row { display: grid; grid-template-columns: 8.5rem 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row dt { color: var(--muted); font-size: .92rem; }
.row dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.row dd small { display: block; color: var(--muted); font-weight: 400; }
.arrow { color: var(--muted); padding: 0 4px; }

.foot { color: var(--muted); font-size: .85rem; padding-block: 8px 28px; }

@media (min-width: 520px) { .btn-row { grid-template-columns: 1fr 1fr; } }
@media (max-width: 380px) { .row { grid-template-columns: 1fr; gap: 2px; } }
@media (prefers-reduced-motion: no-preference) {
  .view { animation: rise .25s ease-out; }
  @keyframes rise { from { opacity: .0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
</style>
</head>

<section id="view-home" class="view">

  <main>

          <li><span class="dot">3</span><span data-i18n="why3"></span></li>

      </div>
      <div class="card">

  </main>
</section>

<section id="view-book" class="view" hidden>

    <div class="wrap stack">

        <p class="sub" data-i18n="bookSub"></p>
      </div>
      <form id="bookForm" class="card" novalidate>
        <div class="field">
          <label for="name" data-i18n="name"></label>
          <input id="name" name="name" type="text" autocomplete="name" data-i18n-ph="namePh">
          <p class="err" id="errName" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="phone" data-i18n="phone"></label>
          <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" data-i18n-ph="phonePh">
          <p class="err" id="errPhone" aria-live="polite"></p>
        </div>
        <div class="places">
          <div class="pair">
            <div class="field">
              <label for="pickup" data-i18n="pickup"></label>
              <input id="pickup" name="pickup" type="text" list="placeList" autocomplete="off" data-i18n-ph="placePh">
              <p class="err" id="errPickup" aria-live="polite"></p>
            </div>
            <div class="field">
              <label for="dest" data-i18n="dest"></label>
              <input id="dest" name="dest" type="text" list="placeList" autocomplete="off" data-i18n-ph="placePh">
              <p class="err" id="errDest" aria-live="polite"></p>
            </div>
          </div>
          <button type="button" class="swap" id="swapBtn" data-i18n-aria="swap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg>
          </button>
        </div>
        <datalist id="placeList"></datalist>
        <div class="fare" id="fareBox" aria-live="polite"></div>
        <p class="err" id="errSend" aria-live="polite"></p>
        <button class="btn btn-primary btn-block" type="submit" id="bookBtn" data-i18n="book"></button>
      </form>
      <p class="foot" data-i18n="sample"></p>
    </div>
  </main>
</section>
<section id="view-confirm" class="view" hidden>
  <main>
    <div class="wrap stack">
      <div class="ok">
        <span class="pill"><i></i><span data-i18n="confirmed"></span></span>
        <h2 class="h2" id="confTitle" tabindex="-1" data-i18n="confTitle"></h2>
        <p class="sub" data-i18n="confSub"></p>
      </div>
      <div class="card ticket">
        <div class="head">
          <div>
            <div class="sub" style="margin:0" data-i18n="ref"></div>
            <div class="ref" id="cRef"></div>
          </div>
          <button type="button" class="mini" id="copyBtn" data-i18n="copy"></button>
        </div>
        <dl class="rows">
          <div class="row"><dt data-i18n="passenger"></dt><dd id="cPass"></dd></div>
          <div class="row"><dt data-i18n="route"></dt><dd id="cRoute"></dd></div>
          <div class="row"><dt data-i18n="fare"></dt><dd id="cFare"></dd></div>
          <div class="row"><dt data-i18n="status"></dt><dd data-i18n="waiting"></dd></div>
        </dl>
      </div>
      <p class="sub" data-i18n="payNote"></p>
      <div class="btn-row">
        <button class="btn btn-primary" type="button" id="againBtn" data-i18n="another"></button>
        <button class="btn btn-ghost" type="button" id="homeBtn" data-i18n="goHome"></button>
      </div>
      <p class="foot" data-i18n="sample"></p>
    </div>
  </main>
</section>

      driver: "Darawalkaaga", plate: "Taarikada",
      tbc: "Darawalka kala heshiiso",
      payNote: "Darawalka ku bixi lacag caddaan ah marka safarku dhammaado.",
      another: "Dalbo safar kale", goHome: "Ku laabo hoyga",
      sample: "Kharashyadu waa qiyaas. Darawalku wuxuu xaqiijinayaa qiimaha ugu dambeeya."
    }
  };
  var lang = "en";
  try {
    var saved = localStorage.getItem("jb-lang");
    if (saved === "so" || saved === "en") lang = saved;
    else if ((navigator.language || "").toLowerCase().indexOf("so") === 0) lang = "so";
  } catch (e) {}

  var current = "home";
  var last = null;

  function $(id) { return document.getElementById(id); }
  function t(k) { return STR[lang][k] != null ? STR[lang][k] : k; }
  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

  // ---- Fare logic ----
  function findPlace(text) {
    var s = (text || "").trim().toLowerCase();
    if (!s) return null;
    for (var i = 0; i < PLACES.length; i++) if (PLACES[i].name.toLowerCase() === s) return PLACES[i];
    return null;
  }
  function estimate(a, b) {
    var d = Math.hypot(a.x - b.x, a.y - b.y) * 1.3;   // straight line x 1.3 for road winding
    d = Math.max(d, 0.8);
    var fare = Math.round((25 + 9 * d) / 5) * 5;       // 25 Birr base + 9 Birr per km, nearest 5
    var mins = Math.max(5, Math.round(d / 18 * 60));   // about 18 km/h in town
    return { km: Math.round(d * 10) / 10, fare: fare, mins: mins };
  }

  // ---- Rendering ----
  function applyText() {
    document.documentElement.lang = lang === "so" ? "so" : "en";
    var els = document.querySelectorAll("[data-i18n]");
    for (var i = 0; i < els.length; i++) els[i].textContent = t(els[i].getAttribute("data-i18n"));
    var ph = document.querySelectorAll("[data-i18n-ph]");
    for (var j = 0; j < ph.length; j++) ph[j].setAttribute("placeholder", t(ph[j].getAttribute("data-i18n-ph")));
    var ar = document.querySelectorAll("[data-i18n-aria]");
    for (var k = 0; k < ar.length; k++) ar[k].setAttribute("aria-label", t(ar[k].getAttribute("data-i18n-aria")));
    $("langEn").setAttribute("aria-pressed", String(lang === "en"));
    $("langSo").setAttribute("aria-pressed", String(lang === "so"));
    renderRoutes(); renderFare();
    if (last) renderConfirm();
  }

  function renderRoutes() {
    var box = $("routes"); box.innerHTML = "";
    ROUTES.forEach(function (r) {
      var a = PLACES[r[0]], b = PLACES[r[1]], e = estimate(a, b);
      var btn = document.createElement("button");
      btn.type = "button"; btn.className = "route";
      var rt = document.createElement("span"); rt.className = "rt";
      var bold = document.createElement("b"); bold.textContent = a.name + " → " + b.name;
      var sm = document.createElement("small"); sm.textContent = e.km + " " + t("km") + " · " + e.mins + " " + t("min");
      rt.appendChild(bold); rt.appendChild(sm);
      var rp = document.createElement("span"); rp.className = "rp"; rp.textContent = fmt(e.fare) + " " + t("birr");
      btn.appendChild(rt); btn.appendChild(rp);
      btn.addEventListener("click", function () {
        $("pickup").value = a.name; $("dest").value = b.name;
        clearErrors(); show("book");
      });
      box.appendChild(btn);
    });
  }

  function renderFare() {
    var box = $("fareBox");
    var pv = $("pickup").value, dv = $("dest").value;
    var a = findPlace(pv), b = findPlace(dv);
    var html = '<div class="lab">' + esc(t("fareTitle")) + "</div>";
    if (a && b && a !== b) {
      var e = estimate(a, b);
      html += '<div class="amt">' + esc(fmt(e.fare)) + "<small>" + esc(t("birr")) + "</small></div>" +
        '<div class="meta"><span>' + esc(t("distance")) + ": <b>" + e.km + " " + esc(t("km")) + "</b></span>" +
        "<span>" + esc(t("time")) + ": <b>" + e.mins + " " + esc(t("min")) + "</b></span></div>";
    } else if (pv.trim() && dv.trim() && !(a && b)) {
      html += '<p class="note">' + esc(t("fareUnknown")) + "</p>";
    } else {
      html += '<p class="note">' + esc(t("farePrompt")) + "</p>";
    }
    box.innerHTML = html;
  }

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  function renderConfirm() {
    if (!last) return;
    $("cRef").textContent = last.ref;
    $("cPass").innerHTML = esc(last.name) + "<small>" + esc(last.phone) + "</small>";
    $("cRoute").innerHTML = esc(last.pickup) + '<span class="arrow">→</span>' + esc(last.dest);
    $("cFare").textContent = last.fare != null ? fmt(last.fare) + " " + t("birr") : t("tbc");
  }

  // ---- Views ----
  function show(view) {
    current = view;
    ["home", "book", "confirm"].forEach(function (v) { $("view-" + v).hidden = v !== view; });
    window.scrollTo(0, 0);
    var h = view === "book" ? $("bookTitle") : view === "confirm" ? $("confTitle") : null;
    if (h) h.focus({ preventScroll: true });
    renderFare();
  }
  // ---- Form ----
  function clearErrors() {
    ["Name", "Phone", "Pickup", "Dest"].forEach(function (k) { $("err" + k).textContent = ""; });
    ["name", "phone", "pickup", "dest"].forEach(function (k) { $(k).removeAttribute("aria-invalid"); });
  }
  function fail(inputId, errId, msgKey) {
    $(errId).textContent = t(msgKey); $(inputId).setAttribute("aria-invalid", "true");
  }
  function normPhone(raw) {
    var d = raw.replace(/[\s\-().]/g, "");
    if (/^\+?251[79]\d{8}$/.test(d)) d = "0" + d.replace(/^\+?251/, "");
    else if (/^[79]\d{8}$/.test(d)) d = "0" + d;
    return /^0[79]\d{8}$/.test(d) ? d : null;
  }
  function prettyPhone(d) { return d.slice(0, 4) + " " + d.slice(4, 7) + " " + d.slice(7); }

  function makeRef() {
    var now = new Date();
    var mmdd = ("0" + (now.getMonth() + 1)).slice(-2) + ("0" + now.getDate()).slice(-2);
    return "JB-" + mmdd + "-" + ("000" + Math.floor(Math.random() * 10000)).slice(-4);
  }
  function sendBooking(rec, tries) {
    tries = tries || 0;
    var ref = makeRef();
    return fetch(SUPABASE_URL + "/rest/v1/bookings", {
      method: "POST",
      headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json", "Prefer": "return=minimal" },
      body: JSON.stringify(Object.assign({}, rec, { ref: ref }))
    }).then(function (res) {
      if (res.status === 409 && tries < 3) return sendBooking(rec, tries + 1);   // ref clash, try a new one
      if (!res.ok) throw new Error("HTTP " + res.status);
      return ref;
    });
  }

  $("bookForm").addEventListener("submit", function (ev) {
    ev.preventDefault();
    clearErrors();
    var name = $("name").value.trim(), phoneRaw = $("phone").value;
    var pickup = $("pickup").value.trim(), dest = $("dest").value.trim();
    var phone = normPhone(phoneRaw), bad = null;
    if (name.length < 2) { fail("name", "errName", "errName"); bad = bad || "name"; }
    if (!phone) { fail("phone", "errPhone", "errPhone"); bad = bad || "phone"; }
    if (!pickup) { fail("pickup", "errPickup", "errPickup"); bad = bad || "pickup"; }
    if (!dest) { fail("dest", "errDest", "errDest"); bad = bad || "dest"; }
    if (pickup && dest && pickup.toLowerCase() === dest.toLowerCase()) { fail("dest", "errDest", "errSame"); bad = bad || "dest"; }
    if (bad) { $(bad).focus(); return; }

    var a = findPlace(pickup), b = findPlace(dest);
    var e = a && b ? estimate(a, b) : null;
    var rec = {
      name: name, phone: phone,
      pickup: a ? a.name : pickup, dest: b ? b.name : dest,
      fare: e ? e.fare : null, lang: lang, status: "new"
    };
    var btn = $("bookBtn");
    btn.disabled = true; btn.textContent = t("sending"); $("errSend").textContent = "";
    sendBooking(rec).then(function (ref) {
      last = { ref: ref, name: name, phone: prettyPhone(phone), pickup: rec.pickup, dest: rec.dest, fare: rec.fare };
      $("copyBtn").textContent = t("copy");
      renderConfirm();
      show("confirm");
    }).catch(function () {
      $("errSend").textContent = t("errSend");
    }).then(function () {
      btn.disabled = false; btn.textContent = t("book");
    });
  });

  ["pickup", "dest"].forEach(function (id) { $(id).addEventListener("input", renderFare); $(id).addEventListener("change", renderFare); });

  $("swapBtn").addEventListener("click", function () {
    var p = $("pickup").value; $("pickup").value = $("dest").value; $("dest").value = p; renderFare();
  });

  $("copyBtn").addEventListener("click", function () {
    if (!last) return;
    var btn = $("copyBtn");
    function done() { btn.textContent = t("copied"); setTimeout(function () { btn.textContent = t("copy"); }, 1600); }
    function fallback() {
      var r = document.createRange(); r.selectNodeContents($("cRef"));
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    }
    try {
      navigator.clipboard.writeText(last.ref).then(done, fallback);
    } catch (e) { fallback(); }
  });

  // ---- Navigation ----
  $("ctaBook").addEventListener("click", function () { show("book"); });
  $("brandBtn").addEventListener("click", function () { show("home"); });
  $("tabHome").addEventListener("click", function () { show("home"); });
  $("homeBtn").addEventListener("click", function () { show("home"); });
  $("againBtn").addEventListener("click", function () {
    $("pickup").value = ""; $("dest").value = ""; clearErrors(); show("book");
  });

  document.querySelectorAll(".lang button").forEach(function (b) {
    b.addEventListener("click", function () {
      lang = b.getAttribute("data-lang");
      try { localStorage.setItem("jb-lang", lang); } catch (e) {}
      applyText();
    });
  });

  // ---- Init ----
  var dl = $("placeList");
  PLACES.forEach(function (p) { var o = document.createElement("option"); o.value = p.name; dl.appendChild(o); });
  applyText();
})();
</script>
</body>
</html>
