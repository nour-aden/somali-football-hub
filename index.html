<style>
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #f2f5fb;
  --surface: #ffffff;
  --fg: #111c3a;
  --muted: #55627f;
  --line: #d8dfee;
  --blue: #1b3b9c;
  --blue-soft: #e4eafb;
  --yellow: #f5b820;
  --yellow-ink: #1a1500;
  --good: #14744a;
  --good-soft: #dcf3e8;
  --bad: #b3261e;
  --hero-bg: #1b3b9c;
  --hero-fg: #ffffff;
  --hero-muted: #cdd8f6;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1127; --surface: #141c38; --fg: #eaeefb; --muted: #9aa7c7; --line: #26315a;
    --blue: #8fa8ff; --blue-soft: #1c2a5c;
    --yellow: #f5b820; --yellow-ink: #1a1500;
    --good: #6ee0a6; --good-soft: #14362a; --bad: #ff8a80;
    --hero-bg: #12266b; --hero-fg: #ffffff; --hero-muted: #b9c6f0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1127; --surface: #141c38; --fg: #eaeefb; --muted: #9aa7c7; --line: #26315a;
  --blue: #8fa8ff; --blue-soft: #1c2a5c;
  --yellow: #f5b820; --yellow-ink: #1a1500;
  --good: #6ee0a6; --good-soft: #14362a; --bad: #ff8a80;
  --hero-bg: #12266b; --hero-fg: #ffffff; --hero-muted: #b9c6f0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.1; }
p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
button { touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }

.wrap {
  width: 100%; max-width: 560px; margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.ico { width: 32px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.top { position: sticky; top: 0; padding-top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--hero-bg); color: var(--hero-fg); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; letter-spacing: -0.01em; background: none; border: 0; padding: 0; cursor: pointer; color: inherit; min-height: 44px; }
.brand svg { width: 38px; height: auto; }
.lang { display: flex; background: rgba(255,255,255,.14); border-radius: 999px; padding: 3px; gap: 2px; }
.lang button { border: 0; background: transparent; color: var(--hero-fg); min-width: 44px; min-height: 36px; border-radius: 999px; font-weight: 600; font-size: .85rem; letter-spacing: .06em; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--yellow); color: var(--yellow-ink); }
.netbar { background: var(--yellow); color: var(--yellow-ink); font-weight: 600; font-size: .9rem; text-align: center; padding: 8px 16px; }

.bj-body { fill: var(--yellow); }
.bj-top { fill: #ffffff; }
.bj-glass { fill: #1b3b9c; }
.bj-wheel { fill: #0b1127; stroke: #ffffff; stroke-width: 2; }
.bj-hub { fill: #ffffff; }

.hero { background: var(--hero-bg); color: var(--hero-fg); position: relative; }
.hero .wrap { padding-block: 20px 36px; display: grid; gap: 10px; }
.eyebrow { font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--hero-muted); font-weight: 600; }
.hero h1 { font-size: clamp(2.4rem, 12vw, 3.6rem); font-weight: 800; letter-spacing: -0.03em; }
.hero h1 span { color: var(--yellow); }
.hero p.lead { color: var(--hero-muted); max-width: 38ch; font-size: 1.05rem; }
.road { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: #0b1533; }
.road::after { content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 3px;
  background: repeating-linear-gradient(90deg, var(--yellow) 0 22px, transparent 22px 40px); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 22px; border-radius: 14px; border: 0; font-weight: 600; font-size: 1.05rem; cursor: pointer; text-decoration: none; }
.btn-primary { background: var(--yellow); color: var(--yellow-ink); }
.btn-primary:hover { filter: brightness(1.05); }
.btn-primary[disabled] { opacity: .7; cursor: progress; }
.btn-ghost { background: transparent; color: var(--blue); border: 2px solid var(--line); }
.btn-block { width: 100%; }
.btn-row { display: grid; gap: 10px; }

main { padding-block: 22px 28px; }
.stack { display: grid; gap: 24px; }
.sec { display: grid; gap: 12px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; }
.h2 { font-size: 1.35rem; font-weight: 700; }
.sub { color: var(--muted); margin-top: 6px; }

.ride-grid, .del-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ride, .del { display: flex; flex-direction: column; gap: 8px; text-align: left; cursor: pointer; min-width: 0; }
.ride { background: var(--hero-bg); color: var(--hero-fg); border: 0; border-radius: 20px; padding: 16px; min-height: 176px; }
.ride .ico { width: 58px; height: 47px; color: var(--yellow); stroke-width: 1.6; }
.ride h3 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; margin-top: 4px; }
.ride p { color: var(--hero-muted); font-size: .88rem; line-height: 1.35; }
.ride .from { margin-top: auto; align-self: flex-start; background: var(--yellow); color: var(--yellow-ink); font-weight: 700; font-size: .82rem; padding: 4px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.del { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; min-height: 160px; }
.del:hover { border-color: var(--blue); }
.del .icowrap { width: 52px; height: 52px; border-radius: 14px; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; }
.del h3 { font-size: 1.15rem; font-weight: 700; }
.del p { color: var(--muted); font-size: .85rem; line-height: 1.35; }
.del .from { margin-top: auto; color: var(--blue); font-weight: 700; font-size: .85rem; font-variant-numeric: tabular-nums; }

.steps { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 12px; }
.steps li { display: flex; gap: 12px; align-items: flex-start; }
.dot { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; font-weight: 700; font-size: .85rem; }

.inst { display: grid; gap: 10px; }
.inst details { border-top: 1px solid var(--line); }
.inst summary { cursor: pointer; font-weight: 600; min-height: 48px; display: flex; align-items: center; }
.inst ol { margin: 0 0 12px; padding-left: 22px; display: grid; gap: 6px; }

.routes { display: grid; gap: 10px; margin-top: 12px; }
.route { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 56px; cursor: pointer; }
.route:hover { border-color: var(--blue); }
.route .rt { min-width: 0; display: grid; gap: 2px; }
.route .rt b { font-weight: 600; overflow-wrap: anywhere; }
.route .rt small { color: var(--muted); }
.route .rp { flex: none; font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; color: var(--blue); font-variant-numeric: tabular-nums; }

.back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px 0 6px; border: 0; background: transparent; color: var(--blue); font-weight: 600; cursor: pointer; border-radius: 12px; justify-self: start; }
.back svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.chip { display: grid; justify-items: center; align-content: center; gap: 4px; padding: 10px 4px; min-height: 68px; min-width: 0; border: 2px solid var(--line); border-radius: 14px; background: var(--surface); cursor: pointer; font-weight: 600; font-size: .85rem; color: var(--fg); }
.chip .ico { width: 30px; height: 24px; color: var(--blue); }
.chip[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); }

form { display: grid; gap: 16px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-weight: 600; font-size: .92rem; }
.field input, .field textarea { width: 100%; padding: 0 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); font-size: 1rem; }
.field input { min-height: 52px; }
.field textarea { min-height: 92px; padding: 12px 14px; resize: vertical; line-height: 1.4; }
.field input:focus, .field textarea:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--yellow) 55%, transparent); }
.field [aria-invalid="true"] { border-color: var(--bad); }
.err { color: var(--bad); font-size: .88rem; min-height: 0; }
.err:empty { display: none; }
.places { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
.places .pair { display: grid; gap: 16px; min-width: 0; }
.swap { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); color: var(--blue); cursor: pointer; display: grid; place-items: center; align-self: center; }
.swap svg { width: 22px; height: 22px; }

.fare { background: var(--blue-soft); border-radius: 14px; padding: 16px; display: grid; gap: 8px; }
.fare .lab { font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.fare .amt { font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; letter-spacing: -0.02em; color: var(--fg); font-variant-numeric: tabular-nums; line-height: 1; }
.fare .amt small { font-size: 1.1rem; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.fare .meta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: .95rem; font-variant-numeric: tabular-nums; }
.fare .meta b { color: var(--fg); font-weight: 600; }
.fare .note { color: var(--muted); }

.ok { display: grid; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 8px; align-self: start; justify-self: start; background: var(--good-soft); color: var(--good); font-weight: 600; font-size: .88rem; padding: 6px 12px; border-radius: 999px; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: block; }
.ticket { padding: 0; overflow: hidden; }
.ticket .head { padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 2px dashed var(--line); flex-wrap: wrap; }
.ticket .ref { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; letter-spacing: .02em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.mini { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; min-height: 40px; padding: 0 14px; cursor: pointer; font-weight: 600; color: var(--blue); }
.rows { display: grid; padding: 6px 18px 12px; margin: 0; }
.row { display: grid; grid-template-columns: 8.5rem 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row dt { color: var(--muted); font-size: .92rem; }
.row dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.row dd small { display: block; color: var(--muted); font-weight: 400; }
.arrow { color: var(--muted); padding: 0 4px; }

.foot { color: var(--muted); font-size: .85rem; padding-block: 0 28px; }
  @media (min-width: 520px) { .btn-row { grid-template-columns: 1fr 1fr; } }
@media (max-width: 380px) { .row { grid-template-columns: 1fr; gap: 2px; } .chip { font-size: .8rem; } }
@media (prefers-reduced-motion: no-preference) {
  .view { animation: rise .25s ease-out; }
  .ride, .del, .chip { transition: transform .12s ease; }
  .ride:active, .del:active, .chip:active { transform: scale(.97); }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-bajaj" viewBox="0 0 32 26"><path d="M6 11 8.5 5H18Q19.5 5 20.3 6.4L23 11"/><path d="M3 11H25Q28 11 28 14V18H3Z"/><circle cx="8" cy="19.5" r="3"/><circle cx="23" cy="19.5" r="3"/></symbol>

    <symbol id="i-parcel" viewBox="0 0 32 26"><path d="M16 3 28 8V18L16 23 4 18V8Z"/><path d="M4 8 16 13 28 8"/><path d="M16 13V23"/></symbol>
    <symbol id="i-food" viewBox="0 0 32 26"><path d="M5 12H27Q27 21 16 21Q5 21 5 12Z"/><path d="M11 8Q9.5 6 11 4M16 8Q14.5 6 16 4M21 8Q19.5 6 21 4"/><path d="M12 23.5H20"/></symbol>

</svg>

<header class="top">
  <div class="wrap">
    <button class="brand" type="button" id="brandBtn" aria-label="Jigjiga Bajaj">
      <svg viewBox="0 0 120 80" aria-hidden="true">
        <path class="bj-top" d="M20 46 L27 22 Q28 18 33 18 H76 Q82 18 85 24 L97 46 Z"/>
        <path class="bj-glass" d="M30 42 L34 26 H56 V42 Z M61 42 V26 H76 Q79 26 81 29 L89 42 Z"/>
        <path class="bj-body" d="M12 46 H104 Q112 46 112 54 V60 H12 Z"/>
        <circle class="bj-wheel" cx="30" cy="62" r="11"/><circle class="bj-hub" cx="30" cy="62" r="3.5"/>
        <circle class="bj-wheel" cx="96" cy="62" r="11"/><circle class="bj-hub" cx="96" cy="62" r="3.5"/>
      </svg>
      <span>Jigjiga Bajaj</span>
    </button>
    <div class="lang" role="group" aria-label="Language / Luqad">
      <button type="button" id="langEn" data-lang="en" aria-pressed="true" lang="en" aria-label="English">EN</button>
      <button type="button" id="langSo" data-lang="so" aria-pressed="false" lang="so" aria-label="Soomaali">SO</button>
    </div>
  </div>
  <div class="netbar" id="netBar" role="status" hidden data-i18n="offlineBar"></div>
</header>

<section id="view-home" class="view">
  <div class="hero">
    <div class="wrap">
      <p class="eyebrow" data-i18n="tagline"></p>
      <h1>Jigjiga <span>Bajaj</span></h1>
      <p class="lead" data-i18n="welcome"></p>
    </div>
    <div class="road" aria-hidden="true"></div>
  </div>
  <main>
    <div class="wrap stack">
      <section class="sec" aria-labelledby="hRides">
        <div>
          <h2 class="h2" id="hRides" data-i18n="secRides"></h2>
          <p class="sub" data-i18n="secRidesSub"></p>
        </div>
        <div class="ride-grid" id="rideGrid"></div>
      </section>

      <section class="sec" aria-labelledby="hDeliver">
        <div>
          <h2 class="h2" id="hDeliver" data-i18n="secDeliver"></h2>
          <p class="sub" data-i18n="secDeliverSub"></p>
        </div>
        <div class="del-grid" id="delGrid"></div>
      </section>

      <div class="card">
        <h2 class="h2" data-i18n="howTitle"></h2>
        <ol class="steps">
          <li><span class="dot">1</span><span data-i18n="how1"></span></li>
          <li><span class="dot">2</span><span data-i18n="how2"></span></li>
          <li><span class="dot">3</span><span data-i18n="how3"></span></li>
        </ol>
        <p class="sub" data-i18n="cashNote"></p>
      </div>

      <div class="card">
        <h2 class="h2" data-i18n="popular"></h2>
        <div class="routes" id="routes"></div>
      </div>

      <div class="card inst" id="installCard" hidden>
        <div>
          <h2 class="h2" data-i18n="instTitle"></h2>
          <p class="sub" data-i18n="instIntro"></p>
        </div>
        <button class="btn btn-primary" type="button" id="installBtn" hidden data-i18n="instBtn"></button>
        <details>
          <summary data-i18n="instAndroid"></summary>
          <ol>
            <li data-i18n="instA1"></li>
            <li data-i18n="instA2"></li>
            <li data-i18n="instA3"></li>
          </ol>
        </details>
        <details id="iosDetails">
          <summary data-i18n="instIos"></summary>
          <ol>
            <li data-i18n="instI1"></li>
            <li data-i18n="instI2"></li>
            <li data-i18n="instI3"></li>
            <li data-i18n="instI4"></li>
          </ol>
        </details>
      </div>

      <p class="foot" data-i18n="sample"></p>
    </div>
  </main>
</section>

<section id="view-book" class="view" hidden>
  <main>
    <div class="wrap stack">
      <button type="button" class="back" id="backBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
        <span data-i18n="navHome"></span>
      </button>
      <div>

    $("cFare").textContent = last.fare != null ? fmt(last.fare) + " " + t("birr") : t("tbc");
  }

  function show(view, push) {
    ["home", "book", "confirm"].forEach(function (v) { $("view-" + v).hidden = v !== view; });
    window.scrollTo(0, 0);
    var h = view === "book" ? $("bookTitle") : view === "confirm" ? $("confTitle") : null;
    if (h) h.focus({ preventScroll: true });
    renderFare();
    if (push !== false) {
      try { (view === "home" ? history.replaceState : history.pushState).call(history, { view: view }, ""); } catch (e) {}
    }
  }
  window.addEventListener("popstate", function (ev) {
    var v = ev.state && ev.state.view;
    if (v === "confirm" && !last) v = "home";
    show(v === "book" || v === "confirm" ? v : "home", false);
  });
  try { history.replaceState({ view: "home" }, ""); } catch (e) {}

  function openBook(id) {
    if (id) svcId = id;
    clearErrors();
    renderChips();
    applyService();
    show("book");
  }

  var ERR_IDS = ["Name", "Phone", "Pickup", "Dest", "Details", "Receiver"];
  function clearErrors() {
    ERR_IDS.forEach(function (k) {
      $("err" + k).textContent = "";
      $(k.toLowerCase()).removeAttribute("aria-invalid");
    });
    $("errSend").textContent = "";
  }
  function fail(inputId, errId, msgKey) {
    $(errId).textContent = t(msgKey); $(inputId).setAttribute("aria-invalid", "true");
  }
  function normPhone(raw) {
    var d = raw.replace(/[\s\-().]/g, "");
    if (/^\+?251[79]\d{8}$/.test(d)) d = "0" + d.replace(/^\+?251/, "");
    else if (/^[79]\d{8}$/.test(d)) d = "0" + d;
    return /^0[79]\d{8}$/.test(d) ? d : null;
  }
  function prettyPhone(d) { return d.slice(0, 4) + " " + d.slice(4, 7) + " " + d.slice(7); }

  function randomBytes(n) {
    var b = new Uint8Array(n);
    (window.crypto || window.msCrypto).getRandomValues(b);
    return b;
  }
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    var b = randomBytes(16); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
    var h = Array.prototype.map.call(b, function (x) { return ("0" + x.toString(16)).slice(-2); }).join("");
    return h.slice(0, 8) + "-" + h.slice(8, 12) + "-" + h.slice(12, 16) + "-" + h.slice(16, 20) + "-" + h.slice(20);
  }
  function makeRef() {
    var A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", b = randomBytes(6), s = "";
    for (var i = 0; i < 6; i++) s += A.charAt(b[i] % A.length);
    var now = new Date();
    var mmdd = ("0" + (now.getMonth() + 1)).slice(-2) + ("0" + now.getDate()).slice(-2);
    return "JB-" + mmdd + "-" + s;
  }

  function post(body) {
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 15000);
    return fetch(SUPABASE_URL + "/rest/v1/bookings", {
      method: "POST",
      headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json", "Prefer": "return=minimal" },
      body: JSON.stringify(body),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (res) {
      clearTimeout(timer);
      if (res.ok) return { ok: true, status: res.status };
      return res.text().then(function (txt) {
        var j = {}; try { j = JSON.parse(txt); } catch (e) {}
        return { ok: false, status: res.status, code: j.code || "", msg: (j.message || "") + " " + (j.details || "") };
      });
    }, function () {
      clearTimeout(timer);
      return { ok: false, status: 0, network: true };
    });
  }

  function sendBooking(rec, att, tries) {
    tries = tries || 0;
    return post(Object.assign({}, rec, { id: att.id, ref: att.ref })).then(function (r) {
      if (r.ok) return att.ref;
      if (r.status === 409) {
        if (/bookings_ref|\(ref\)/i.test(r.msg) && tries < 3) { att.ref = makeRef(); return sendBooking(rec, att, tries + 1); }
        return att.ref;
      }
      throw r;
    });
  }
  function errorText(r) {
    var key = "errSend";
    if (r && r.network) key = navigator.onLine === false ? "errOffline" : "errNetwork";
    else if (r && (r.status === 401 || r.status === 403)) key = "errAccess";
    else if (r && r.status === 404) key = "errSetup";
    else if (r && (r.status === 400 || r.status === 422)) key = "errData";
    else if (r && r.status === 429) key = "errBusy";
    else if (r && r.status >= 500) key = "errServer";
    var code = r && r.status != null ? " (" + (r.status || "network") + (r.code ? " " + r.code : "") + ")" : "";
    return t(key) + code;
  }

  $("bookForm").addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (sending) return;
    clearErrors();
    var s = svc(svcId), del = s.kind === "delivery";
    var name = $("name").value.trim();
    var pickup = $("pickup").value.trim(), dest = $("dest").value.trim();
    var detailsVal = $("details").value.trim(), recvRaw = $("receiver").value.trim();
    var phone = normPhone($("phone").value), recv = recvRaw ? normPhone(recvRaw) : null, bad = null;
    if (name.length < 2) { fail("name", "errName", "errName"); bad = bad || "name"; }
    if (!phone) { fail("phone", "errPhone", "errPhone"); bad = bad || "phone"; }
    if (!pickup) { fail("pickup", "errPickup", "errPickup"); bad = bad || "pickup"; }
    if (!dest) { fail("dest", "errDest", "errDest"); bad = bad || "dest"; }
    if (pickup && dest && pickup.toLowerCase() === dest.toLowerCase()) { fail("dest", "errDest", "errSame"); bad = bad || "dest"; }
    if (del && detailsVal.length < 3) { fail("details", "errDetails", "errDetails"); bad = bad || "details"; }
    if (del && recvRaw && !recv) { fail("receiver", "errReceiver", "errPhone"); bad = bad || "receiver"; }
    if (bad) { $(bad).focus(); return; }

    var a = findPlace(pickup), b = findPlace(dest);
    var e = a && b ? estimate(a, b, s) : null;
    var details = del ? detailsVal + (recv ? " | Receiver: " + recv : "") : null;
    var rec = {
      service: s.id, name: name, phone: phone,
      pickup: a ? a.name : pickup, dest: b ? b.name : dest,
      details: details, fare: e ? e.fare : null, lang: lang, status: "new"
    };

    var fp = JSON.stringify([rec.service, rec.name, rec.phone, rec.pickup, rec.dest, rec.details]);
    if (recent && recent.fp === fp && Date.now() - recent.at < 10 * 60 * 1000) {
      last = recent.last; renderConfirm(); show("confirm"); return;
    }

    if (navigator.onLine === false) { $("errSend").textContent = t("errOffline"); return; }

    if (!attempt || attempt.fp !== fp) attempt = { fp: fp, id: uuid(), ref: makeRef() };
    var btn = $("bookBtn");
    sending = true; btn.disabled = true; btn.textContent = t("sending");
    sendBooking(rec, attempt).then(function (ref) {
      last = { ref: ref, service: s.id, name: name, phone: prettyPhone(phone), pickup: rec.pickup, dest: rec.dest, details: details, fare: rec.fare };
      recent = { fp: fp, at: Date.now(), last: last };
      attempt = null;
      $("copyBtn").textContent = t("copy");
      renderConfirm();
      show("confirm");
    }).catch(function (r) {
      $("errSend").textContent = errorText(r);
    }).then(function () {
      sending = false; btn.disabled = false; btn.textContent = t("book");
    });
  });

  ["pickup", "dest"].forEach(function (id) { $(id).addEventListener("input", renderFare); $(id).addEventListener("change", renderFare); });

  $("swapBtn").addEventListener("click", function () {
    var p = $("pickup").value; $("pickup").value = $("dest").value; $("dest").value = p; renderFare();
  });

  $("copyBtn").addEventListener("click", function () {
    if (!last) return;
    var btn = $("copyBtn");
    function done() { btn.textContent = t("copied"); setTimeout(function () { btn.textContent = t("copy"); }, 1600); }
    function fallback() {
      var r = document.createRange(); r.selectNodeContents($("cRef"));
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    }
    try {
      navigator.clipboard.writeText(last.ref).then(done, fallback);
    } catch (e) { fallback(); }
  });

  $("view-home").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-svc]");
    if (b) openBook(b.getAttribute("data-svc"));
  });
  $("chips").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-chip]");
    if (!b) return;
    svcId = b.getAttribute("data-chip");
    renderChips(); applyService(); renderFare();
  });
  $("brandBtn").addEventListener("click", function () { show("home"); });
  $("backBtn").addEventListener("click", function () { show("home"); });
  $("homeBtn").addEventListener("click", function () { show("home"); });
  $("againBtn").addEventListener("click", function () {
    ["pickup", "dest", "details", "receiver"].forEach(function (id) { $(id).value = ""; });
    openBook(svcId);
  });

  document.querySelectorAll(".lang button").forEach(function (b) {
    b.addEventListener("click", function () {
      lang = b.getAttribute("data-lang");
      try { localStorage.setItem("jb-lang", lang); } catch (e) {}
      applyText();
    });
  });

  function isStandalone() {
    return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
  }
  var installEvent = null;
  window.addEventListener("beforeinstallprompt", function (ev) {
    ev.preventDefault(); installEvent = ev; $("installBtn").hidden = false;
  });
  $("installBtn").addEventListener("click", function () {
    if (!installEvent) return;
    installEvent.prompt();
    installEvent.userChoice.then(function () { installEvent = null; $("installBtn").hidden = true; });
  });
  window.addEventListener("appinstalled", function () { $("installCard").hidden = true; });
  // Inside the Android app (Capacitor) there is nothing to install, so the card stays hidden.
  var NATIVE = !!(window.Capacitor && typeof window.Capacitor.isNativePlatform === "function" && window.Capacitor.isNativePlatform());
  if (!isStandalone() && !NATIVE) $("installCard").hidden = false;
  if (/iPad|iPhone|iPod/.test(navigator.userAgent)) $("iosDetails").open = true;

  function netState() { $("netBar").hidden = navigator.onLine !== false; }
  window.addEventListener("online", netState);
  window.addEventListener("offline", netState);
  netState();

  if ("serviceWorker" in navigator && !NATIVE) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(function () {});
    });
  }

  // Android back button (app only): from the booking or confirmation page go to the home page; on the home page leave the app.
  if (NATIVE && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
    try {
      window.Capacitor.Plugins.App.addListener("backButton", function () {
        if ($("view-home").hidden) show("home"); else window.Capacitor.Plugins.App.exitApp();
      });
    } catch (e) {}
  }

  var dl = $("placeList");
  PLACES.forEach(function (p) { var o = document.createElement("option"); o.value = p.name; dl.appendChild(o); });
  applyText();
})();
</script>
</body>
</html>
