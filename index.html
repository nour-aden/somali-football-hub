
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Management System</title>

<style>
:root {
  --green:#176b57;
  --dark:#123b35;
  --bg:#f4f7f6;
  --white:#fff;
  --line:#e5ece9;
  --muted:#71817c;
  --gold:#e9b44c;
  --red:#c94d4d;
}
* { box-sizing:border-box; }
body {
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:#172b27;
}
button,input,select { font:inherit; }
button { cursor:pointer; }
.app { display:flex; min-height:100vh; }
.sidebar {
  width:245px;
  background:var(--dark);
  color:white;
  padding:20px;
  position:fixed;
  top:0;bottom:0;left:0;
}
.brand {
  font-size:19px;
  font-weight:bold;
  padding:12px 5px 25px;
}
.logo {
  background:var(--gold);
  color:var(--dark);
  padding:10px;
  border-radius:10px;
  display:inline-block;
  margin-right:8px;
}
.nav button {
  display:block;
  width:100%;
  text-align:left;
  border:0;
  padding:12px;
  margin:4px 0;
  color:white;
  background:transparent;
  border-radius:8px;
}
.nav button:hover,.nav button.active {
  background:#24564c;
}
.main {
  margin-left:245px;
  width:calc(100% - 245px);
}
.topbar {
  height:65px;
  background:white;
  padding:15px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--line);
}
.content { padding:25px; }
h1 { font-size:20px; margin:0; }
h2 { font-size:22px; }
h3 { font-size:16px; }
.muted { color:var(--muted); }
.cards {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin:20px 0;
}
.card,.panel {
  background:white;
  padding:18px;
  border:1px solid var(--line);
  border-radius:12px;
  margin-bottom:17px;
}
.card strong {
  display:block;
  font-size:27px;
  margin-top:10px;
}
.toolbar {
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}
.btn {
  border:1px solid var(--line);
  background:white;
  padding:9px 13px;
  border-radius:8px;
}
.btn.primary {
  background:var(--green);
  color:white;
  border-color:var(--green);
}
input,select {
  padding:10px;
  border:1px solid var(--line);
  border-radius:8px;
  width:100%;
  background:white;
}
.search { max-width:300px; }
table {
  width:100%;
  border-collapse:collapse;
  min-width:550px;
}
th,td {
  padding:12px 10px;
  text-align:left;
  border-bottom:1px solid var(--line);
  font-size:13px;
}
th { color:var(--muted); }
.tablewrap { overflow-x:auto; }
.formgrid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.field label {
  display:block;
  margin-bottom:5px;
  font-size:13px;
  font-weight:bold;
}
.field { margin-bottom:10px; }
.modalback {
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:10;
}
.modalback.show { display:flex; }
.modal {
  background:white;
  padding:22px;
  border-radius:13px;
  width:100%;
  max-width:550px;
  max-height:90vh;
  overflow:auto;
}
.modalhead,.modalfoot {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}
.modalfoot { justify-content:flex-end; }
.tag {
  background:#e3f4eb;
  color:#18704d;
  padding:4px 8px;
  border-radius:15px;
}
.empty {
  text-align:center;
  padding:30px;
  color:var(--muted);
}
.toast {
  display:none;
  position:fixed;
  bottom:20px;
  right:20px;
  background:var(--dark);
  color:white;
  padding:12px 18px;
  border-radius:8px;
}
.toast.show { display:block; }
.login {
  min-height:100vh;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#123b35,#246c59);
  padding:20px;
}
.loginbox {
  background:white;
  padding:28px;
  border-radius:15px;
  width:100%;
  max-width:400px;
}
.loginbox .field { margin-top:14px; }
.loginbox button { width:100%; margin-top:15px; }
.hidden { display:none!important; }
@media(max-width:900px) {
  .cards { grid-template-columns:repeat(2,1fr); }
}
@media(max-width:700px) {
  .sidebar { display:none; }
  .main { margin-left:0; width:100%; }
  .content { padding:15px; }
  .topbar { padding:12px; }
  .formgrid { grid-template-columns:1fr; }
}
@media print {
  .sidebar,.topbar,.toolbar,.btn { display:none!important; }
  .main { margin:0;width:100%; }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="login">
  <div class="loginbox">
    <div class="brand">🏫 My School</div>
    <h2>Welcome Back</h2>
    <p class="muted">School Management System</p>

    <div class="field">
      <label>Username</label>
      <input id="username" value="admin">
    </div>

    <div class="field">
      <label>Password</label>
      <input id="password" type="password" value="admin123">
    </div>

    <button class="btn primary" onclick="login()">Sign In</button>
    <p class="muted">Demo: admin / admin123</p>
  </div>
</div>

<!-- APPLICATION -->
<div id="app" class="app hidden">

  <aside class="sidebar">
    <div class="brand">🏫 My School</div>
    <nav class="nav">
      <button class="active" onclick="showPage('dashboard',this)">▦ Dashboard</button>
      <button onclick="showPage('students',this)">♙ Students</button>
      <button onclick="showPage('teachers',this)">♟ Teachers</button>
      <button onclick="showPage('classes',this)">▤ Classes</button>
      <button onclick="showPage('attendance',this)">✓ Attendance</button>
      <button onclick="showPage('exams',this)">✎ Exams & Marks</button>
      <button onclick="showPage('fees',this)">◈ Fees & Payments</button>
      <button onclick="showPage('reports',this)">▥ Reports</button>
      <button onclick="showPage('settings',this)">⚙ Settings</button>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 id="pageTitle">Dashboard</h1>
      <button class="btn" onclick="logout()">Log Out</button>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<!-- MODAL -->
<div class="modalback" id="modalBack">
  <div class="modal">
    <div class="modalhead">
      <h3 id="modalTitle">Add Record</h3>
      <button class="btn" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody"></div>
    <div class="modalfoot">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" id="modalSave">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);

let db = JSON.parse(localStorage.getItem("schoolData") || "null") || {
  students:[],
  teachers:[],
  classes:[
    {id:1,name:"Grade 1",level:"Primary"},
    {id:2,name:"Grade 2",level:"Primary"},
    {id:3,name:"Grade 7",level:"Secondary"}
  ],
  attendance:[],
  marks:[],
  payments:[],
  settings:{
    schoolName:"My School",
    academicYear:"2026/2027"
  }
};

let currentPage = "dashboard";
let today = new Date().toISOString().slice(0,10);

function saveData(){
  localStorage.setItem("schoolData",JSON.stringify(db));
}

function makeId(){
  return Date.now()+Math.floor(Math.random()*1000);
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  }[c]));
}

function toast(message){
  let el=$("#toast");
  el.textContent=message;
  el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),2200);
}

function login(){
  if($("#username").value==="admin" &&
     $("#password").value==="admin123"){
    $("#loginScreen").classList.add("hidden");
    $("#app").classList.remove("hidden");
    render();
  }else{
    alert("Incorrect username or password");
  }
}

function logout(){
  $("#app").classList.add("hidden");
  $("#loginScreen").classList.remove("hidden");
}

function showPage(page,button){
  currentPage=page;
  document.querySelectorAll(".nav button").forEach(b=>{
    b.classList.remove("active");
  });
  if(button)button.classList.add("active");
  render();
}

function render(){
  let pages={
    dashboard:dashboardPage,
    students:studentsPage,
    teachers:teachersPage,
    classes:classesPage,
    attendance:attendancePage,
    exams:examsPage,
    fees:feesPage,
    reports:reportsPage,
    settings:settingsPage
  };
  pages[currentPage]();
}

function setTitle(title){
  $("#pageTitle").textContent=title;
}

function className(id){
  return db.classes.find(c=>String(c.id)===String(id))?.name || "—";
}

function stat(label,value){
  return `<div class="card">
    <span class="muted">${label}</span>
    <strong>${value}</strong>
  </div>`;
}

/* DASHBOARD */
function dashboardPage(){
  setTitle("Dashboard");

  let paid=db.payments.reduce((a,p)=>a+Number(p.amount),0);

  $("#content").innerHTML=`
    <h2>Welcome to ${escapeHTML(db.settings.schoolName)}</h2>
    <p class="muted">Academic Year: ${escapeHTML(db.settings.academicYear)}</p>

    <div class="cards">
      ${stat("Total Students",db.students.length)}
      ${stat("Total Teachers",db.teachers.length)}
      ${stat("Total Classes",db.classes.length)}
      ${stat("Fees Collected",paid.toLocaleString()+" ETB")}
    </div>

    <div class="panel">
      <h3>Quick Actions</h3>
      <div class="toolbar">
        <button class="btn primary" onclick="openStudentForm()">+ Add Student</button>
        <button class="btn" onclick="showPage('attendance')">Attendance</button>
        <button class="btn" onclick="openPaymentForm()">Record Payment</button>
        <button class="btn" onclick="showPage('reports')">Reports</button>
      </div>
    </div>

    <div class="panel">
      <h3>Recent Students</h3>
      ${studentTable(db.students.slice(-5).reverse(),false)}
    </div>
  `;
}

/* STUDENTS */
function studentsPage(){
  setTitle("Students");
  $("#content").innerHTML=`
    <div class="toolbar">
      <h2>Student List</h2>
      <button class="btn primary" onclick="openStudentForm()">+ Add Student</button>
    </div>
    <div class="panel">
      <div class="toolbar">
        <input class="search" id="studentSearch"
          placeholder="Search students..." oninput="filterStudents()">
        <button class="btn" onclick="exportCSV('students')">Export CSV</button>
      </div>
      <div id="studentTable">${studentTable(db.students)}</div>
    </div>
  `;
}

function studentTable(rows,actions=true){
  if(!rows.length)return `<div class="empty">No students found.</div>`;

  return `<div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th>Admission No.</th>
          <th>Student Name</th>
          <th>Gender</th>
          <th>Class</th>
          <th>Phone</th>
          <th>Status</th>
          ${actions?'<th>Actions</th>':''}
        </tr>
      </thead>
      <tbody>
        ${rows.map(s=>`
          <tr>
            <td>${escapeHTML(s.admission)}</td>
            <td>${escapeHTML(s.name)}</td>
            <td>${escapeHTML(s.gender)}</td>
            <td>${escapeHTML(className(s.classId))}</td>
            <td>${escapeHTML(s.phone)}</td>
            <td><span class="tag">${escapeHTML(s.status)}</span></td>
            ${actions?`<td>
              <button class="btn" onclick="removeItem('students',${s.id})">Delete</button>
            </td>`:''}
          </tr>
        `).join("")}
      </tbody>
    </table>
  </div>`;
}

function filterStudents(){
  let q=$("#studentSearch").value.toLowerCase();
  let rows=db.students.filter(s=>
    [s.name,s.admission,s.phone,className(s.classId)]
      .join(" ").toLowerCase().includes(q)
  );
  $("#studentTable").innerHTML=studentTable(rows);
}

/* TEACHERS */
function teachersPage(){
  setTitle("Teachers");
  $("#content").innerHTML=`
    <div class="toolbar">
      <h2>Teacher List</h2>
      <button class="btn primary" onclick="openTeacherForm()">+ Add Teacher</button>
    </div>
    <div class="panel">
      <div class="toolbar">
        <input class="search" id="teacherSearch"
          placeholder="Search teachers..." oninput="filterTeachers()">
        <button class="btn" onclick="exportCSV('teachers')">Export CSV</button>
      </div>
      <div id="teacherTable">${teacherTable(db.teachers)}</div>
    </div>
  `;
}

function teacherTable(rows){
  if(!rows.length)return `<div class="empty">No teachers found.</div>`;
  return `<div class="tablewrap"><table>
    <thead><tr>
      <th>Employee No.</th><th>Name</th><th>Phone</th>
      <th>Qualification</th><th>Actions</th>
    </tr></thead>
    <tbody>
      ${rows.map(x=>`<tr>
        <td>${escapeHTML(x.no)}</td>
        <td>${escapeHTML(x.name)}</td>
        <td>${escapeHTML(x.phone)}</td>
        <td>${escapeHTML(x.qualification)}</td>
        <td><button class="btn" onclick="removeItem('teachers',${x.id})">Delete</button></td>
      </tr>`).join("")}
    </tbody>
  </table></div>`;
}

function filterTeachers(){
  let q=$("#teacherSearch").value.toLowerCase();
  $("#teacherTable").innerHTML=teacherTable(
    db.teachers.filter(x=>
      [x.name,x.no,x.phone].join(" ").toLowerCase().includes(q)
    )
  );
}

/* CLASSES */
function classesPage(){
  setTitle("Classes");
  $("#content").innerHTML=`
    <div class="toolbar">
      <h2>Class List</h2>
      <button class="btn primary" onclick="openClassForm()">+ Add Class</button>
    </div>
    <div class="panel">
      <div class="tablewrap"><table>
        <thead><tr><th>Class</th><th>Level</th><th>Students</th><th>Actions</th></tr></thead>
        <tbody>
          ${db.classes.map(c=>`<tr>
            <td>${escapeHTML(c.name)}</td>
            <td>${escapeHTML(c.level)}</td>
            <td>${db.students.filter(s=>String(s.classId)===String(c.id)).length}</td>
            <td><button class="btn" onclick="removeItem('classes',${c.id})">Delete</button></td>
          </tr>`).join("")}
        </tbody>
      </table></div>
    </div>
  `;
}

/* ATTENDANCE */
function attendancePage(){
  setTitle("Attendance");
  $("#content").innerHTML=`
    <h2>Attendance Register</h2>
    <div class="panel">
      <div class="toolbar">
        <select id="attClass" onchange="showAttendanceRows()">
          ${classOptions()}
        </select>
        <input type="date" id="attDate" value="${today}">
        <button class="btn primary" onclick="saveAttendance()">Save Attendance</button>
      </div>
      <div id="attList"></div>
    </div>
    <div class="panel">
      <h3>Recent Attendance</h3>
      ${attendanceHistory()}
    </div>
  `;
  showAttendanceRows();
}

function classOptions(){
  return db.classes.map(c=>
    `<option value="${c.id}">${escapeHTML(c.name)}</option>`
  ).join("");
}

function showAttendanceRows(){
  let cid=$("#attClass").value;
  let students=db.students.filter(s=>String(s.classId)===String(cid));

  if(!students.length){
    $("#attList").innerHTML='<div class="empty">No students in this class.</div>';
    return;
  }

  $("#attList").innerHTML=`<div class="tablewrap"><table>
    <thead><tr><th>Student</th><th>Status</th></tr></thead>
    <tbody>
      ${students.map(s=>{
        let old=db.attendance.find(a=>
          a.studentId===s.id && a.date===$("#attDate").value
        );
        return `<tr>
          <td>${escapeHTML(s.name)}</td>
          <td>
            <select class="attstatus" data-id="${s.id}">
              <option ${old?.status==="Present"?"selected":""}>Present</option>
              <option ${old?.status==="Absent"?"selected":""}>Absent</option>
              <option ${old?.status==="Late"?"selected":""}>Late</option>
              <option ${old?.status==="Excused"?"selected":""}>Excused</option>
            </select>
          </td>
        </tr>`;
      }).join("")}
    </tbody>
  </table></div>`;
}

function saveAttendance(){
  let date=$("#attDate").value;
  let cid=Number($("#attClass").value);

  if(!date || !cid){
    toast("Select date and class.");
    return;
  }

  document.querySelectorAll(".attstatus").forEach(sel=>{
    let studentId=Number(sel.dataset.id);
    let old=db.attendance.find(a=>
      a.studentId===studentId && a.date===date
    );

    if(old){
      old.status=sel.value;
    }else{
      db.attendance.push({
        id:makeId(),
        studentId,
        classId:cid,
        date,
        status:sel.value
      });
    }
  });

  saveData();
  toast("Attendance saved successfully.");
  attendancePage();
}

function attendanceHistory(){
  let rows=db.attendance.slice(-10).reverse();
  if(!rows.length)return '<div class="empty">No attendance records.</div>';

  return `<div class="tablewrap"><table>
    <thead><tr><th>Date</th><th>Student</th><th>Class</th><th>Status</th></tr></thead>
    <tbody>
      ${rows.map(a=>`<tr>
        <td>${a.date}</td>
        <td>${escapeHTML(db.students.find(s=>s.id===a.studentId)?.name||"—")}</td>
        <td>${escapeHTML(className(a.classId))}</td>
        <td>${escapeHTML(a.status)}</td>
      </tr>`).join("")}
    </tbody>
  </table></div>`;
}

/* EXAMS */
function examsPage(){
  setTitle("Exams & Marks");
  $("#content").innerHTML=`
    <div class="toolbar">
      <h2>Exams and Marks</h2>
      <button class="btn primary" onclick="openMarkForm()">+ Add Marks</button>
    </div>
    <div class="panel">
      <div class="toolbar">
        <input class="search" id="markSearch" placeholder="Search..." oninput="filterMarks()">
        <button class="btn" onclick="exportCSV('marks')">Export CSV</button>
      </div>
      <div id="markTable">${markTable(db.marks)}</div>
    </div>
  `;
}

function markTable(rows){
  if(!rows.length)return '<div class="empty">No marks recorded.</div>';

  return `<div class="tablewrap"><table>
    <thead><tr>
      <th>Student</th><th>Class</th><th>Subject</th>
      <th>Exam</th><th>Score</th><th>Maximum</th><th>Action</th>
    </tr></thead>
    <tbody>
      ${rows.map(m=>`<tr>
        <td>${escapeHTML(db.students.find(s=>s.id===m.studentId)?.name||"—")}</td>
        <td>${escapeHTML(className(m.classId))}</td>
        <td>${escapeHTML(m.subject)}</td>
        <td>${escapeHTML(m.title)}</td>
        <td>${m.score}</td><td>${m.max}</td>
        <td><button class="btn" onclick="removeItem('marks',${m.id})">Delete</button></td>
      </tr>`).join("")}
    </tbody>
  </table></div>`;
}

function filterMarks(){
  let q=$("#markSearch").value.toLowerCase();
  $("#markTable").innerHTML=markTable(db.marks.filter(m=>
    [m.subject,m.title,db.students.find(s=>s.id===m.studentId)?.name]
      .join(" ").toLowerCase().includes(q)
  ));
}

/* FEES */
function feesPage(){
  setTitle("Fees & Payments");
  let total=db.payments.reduce((s,p)=>s+Number(p.amount),0);

  $("#content").innerHTML=`
    <div class="toolbar">
      <h2>Fees and Payments</h2>
      <button class="btn primary" onclick="openPaymentForm()">+ Record Payment</button>
    </div>
    <div class="cards">
      ${stat("Fees Collected",total.toLocaleString()+" ETB")}
      ${stat("Students",db.students.length)}
    </div>
    <div class="panel">
      <div class="toolbar">
        <input class="search" id="paymentSearch" placeholder="Search..." oninput="filterPayments()">
        <button class="btn" onclick="exportCSV('payments')">Export CSV</button>
      </div>
      <div id="paymentTable">${paymentTable(db.payments)}</div>
    </div>
  `;
}

function paymentTable(rows){
  if(!rows.length)return '<div class="empty">No payments recorded.</div>';

  return `<div class="tablewrap"><table>
    <thead><tr>
      <th>Date</th><th>Student</th><th>Fee Type</th>
      <th>Amount</th><th>Note</th><th>Action</th>
    </tr></thead>
    <tbody>
      ${rows.slice().reverse().map(p=>`<tr>
        <td>${p.date}</td>
        <td>${escapeHTML(db.students.find(s=>s.id===p.studentId)?.name||"—")}</td>
        <td>${escapeHTML(p.type)}</td>
        <td>${Number(p.amount).toLocaleString()} ETB</td>
        <td>${escapeHTML(p.note)}</td>
        <td><button class="btn" onclick="removeItem('payments',${p.id})">Delete</button></td>
      </tr>`).join("")}
    </tbody>
  </table></div>`;
}
function filterPayments(){
  let q=$("#paymentSearch").value.toLowerCase();
  $("#paymentTable").innerHTML=paymentTable(db.payments.filter(p=>
    [p.type,p.note,db.students.find(s=>s.id===p.studentId)?.name]
      .join(" ").toLowerCase().includes(q)
  ));
}

/* REPORTS */
function reportsPage(){
  setTitle("Reports");
  let present=db.attendance.filter(a=>a.status==="Present").length;
  let absent=db.attendance.filter(a=>a.status==="Absent").length;
  let total=db.payments.reduce((s,p)=>s+Number(p.amount),0);

  $("#content").innerHTML=`
    <div class="toolbar">
      <h2>School Reports</h2>
      <button class="btn" onclick="window.print()">Print Report</button>
    </div>
    <div class="cards">
      ${stat("Students",db.students.length)}
      ${stat("Teachers",db.teachers.length)}
      ${stat("Present",present)}
      ${stat("Absent",absent)}
    </div>
      <div class="panel">
      <h3>School Summary</h3>
      <p>Total Students: <b>${db.students.length}</b></p>
      <p>Total Teachers: <b>${db.teachers.length}</b></p>
      <p>Total Classes: <b>${db.classes.length}</b></p>

/* MODALS */
function openModal(title,html,handler){
  $("#modalTitle").textContent=title;
  $("#modalBody").innerHTML=html;
  $("#modalSave").onclick=()=>{
    let form=$("#modalBody").querySelector("form");
    if(form && !form.reportValidity())return;
    handler(form?Object.fromEntries(new FormData(form)):{});
  };
  $("#modalBack").classList.add("show");
}

function closeModal(){
  $("#modalBack").classList.remove("show");
}

 /* DELETE */
function removeItem(table,recordId){
  if(!confirm("Are you sure you want to delete this record?"))return;

  db[table]=db[table].filter(x=>x.id!==recordId);
  saveData();
  render();
}

/* CSV EXPORT */
function exportCSV(table){
  let rows=db[table];

  if(!rows.length){
    toast("No records to export.");
    return;
  }

  let headers=Object.keys(rows[0]);
  let csv=[
    headers.join(","),
    ...rows.map(row=>headers.map(k=>
      '"'+String(row[k]??"").replace(/"/g,'""')+'"'
    ).join(","))
  ].join("\n");

  let blob=new Blob(["\ufeff"+csv],{
    type:"text/csv;charset=utf-8"
  });

  let link=document.createElement("a");
  link.href=URL.createObjectURL(blob);
  link.download=table+".csv";
  link.click();
  URL.revokeObjectURL(link.href);
}
