<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LifeFix gives you clear, practical step-by-step guides for careers, learning, budgeting, technology, daily life, and small business.">
  <meta name="theme-color" content="#102a43">
  <title>LifeFix — Simple Solutions for Everyday Life</title>

  <style>
    :root {
      --navy: #102a43;
      --navy-deep: #071b2e;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --sky: #eaf2ff;
      --light: #f5f8fc;
      --white: #fff;
      --text: #243b53;
      --muted: #627d98;
      --gold: #ffd166;
      --border: #e1eaf4;
      --shadow: 0 12px 32px rgba(16, 42, 67, .08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 88px;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--light);
      line-height: 1.65;
    }

    button, input, textarea, select { font: inherit; }

    button, a { -webkit-tap-highlight-color: transparent; }

    a { color: var(--blue); }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 8px;
      z-index: 1000;
      background: white;
      padding: 10px 14px;
      border-radius: 8px;
    }

    .skip-link:focus { left: 8px; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 14px max(5%, calc((100% - 1180px)/2));
      background: rgba(7, 27, 46, .97);
      color: white;
      box-shadow: 0 4px 18px rgba(0,0,0,.12);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: white;
      text-decoration: none;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -.5px;
      white-space: nowrap;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 11px;
      color: var(--navy);
      background: var(--gold);
      font-size: 20px;
    }

    .brand span:last-child { color: var(--gold); }

    .nav-links {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .nav-links a {
      color: #edf4ff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      padding: 9px 12px;
      border-radius: 9px;
      transition: background .2s, color .2s;
    }

    .nav-links a:hover,
    .nav-links a:focus-visible {
      color: var(--gold);
      background: rgba(255,255,255,.09);
    }

    .menu-toggle {
      display: none;
      color: white;
      background: transparent;
      border: 1px solid #466079;
      border-radius: 10px;
      padding: 8px 12px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      color: white;
      background:
        radial-gradient(circle at 80% 15%, rgba(37,99,235,.5), transparent 34%),
        linear-gradient(120deg, rgba(7,27,46,.97), rgba(16,42,67,.88)),
        url("https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=1600&q=80")
        center/cover;
    }

    .hero-inner {
      width: min(1180px, 90%);
      margin: auto;
      padding: 82px 0 76px;
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(240px, .75fr);
      align-items: center;
      gap: 48px;
    }

    .eyebrow {
      display: inline-block;
      margin: 0 0 14px;
      padding: 6px 12px;
      border: 1px solid rgba(255,209,102,.45);
      border-radius: 999px;
      background: rgba(255,209,102,.1);
      color: var(--gold);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .4px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(36px, 5.2vw, 60px);
      line-height: 1.08;
      letter-spacing: -1.4px;
    }

    .hero-copy {
      max-width: 660px;
      margin: 0;
      color: #e1eaf5;
      font-size: 18px;
    }

    .search-box {
      display: flex;
      gap: 8px;
      max-width: 670px;
      margin-top: 28px;
      padding: 7px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 14px 36px rgba(0,0,0,.2);
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border: 0;
      outline: 0;
      color: var(--text);
      background: white;
      border-radius: 9px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      background: var(--blue);
      color: white;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      transition: transform .18s, background .18s;
    }

    .btn:hover {
      background: var(--blue-dark);
      transform: translateY(-1px);
    }

    .btn-secondary {
      color: var(--navy);
      background: #eaf2ff;
    }

    .btn-secondary:hover { background: #d9e8ff; }

    .hero-aside {
      padding: 25px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 22px;
      background: rgba(255,255,255,.09);
      backdrop-filter: blur(8px);
    }

    .hero-aside .big-icon { font-size: 38px; }

    .hero-aside h2 { margin: 8px 0; font-size: 22px; }

    .hero-aside p {
      margin: 0;
      color: #e1eaf5;
      font-size: 14px;
    }

    .hero-points {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .hero-point {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #f6f9ff;
      font-size: 14px;
    }

    .hero-point span {
      color: var(--gold);
      font-weight: 900;
    }

    main { min-height: 55vh; }

    .container {
      width: min(1180px, 90%);
      margin: 0 auto;
      padding: 48px 0;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 22px;
    }

    .section-heading h2 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(25px, 3vw, 32px);
      line-height: 1.2;
    }

    .section-heading p {
      margin: 7px 0 0;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      min-width: 0;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: white;
      box-shadow: var(--shadow);
      transition: transform .2s, box-shadow .2s, border-color .2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 38px rgba(16,42,67,.12);
      border-color: #c7dbf7;
    }

    .category-icon {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border-radius: 15px;
      background: var(--sky);
      font-size: 27px;
      margin-bottom: 15px;
    }

    .card h3 {
      margin: 0 0 8px;
      color: var(--navy);
      font-size: 19px;
    }

    .card p {
      margin: 0 0 15px;
      color: var(--muted);
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .text-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-weight: 800;
      font-size: 14px;
      text-decoration: none;
    }

    .text-link:hover { text-decoration: underline; }

    .section-soft { background: #edf4ff; }

    .section-soft .container {
      padding-top: 44px;
      padding-bottom: 44px;
    }

    .solution-card {
      display: flex;
      flex-direction: column;
    }

    .solution-card .category-icon { margin-bottom: 12px; }

    .solution-card .text-link { margin-top: auto; }

    .detail-view { display: none; }

    .detail-view.active {
      display: block;
      animation: appear .25s ease-out;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .detail-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .detail-top .category-icon {
      flex: 0 0 52px;
      margin: 0;
    }

    .detail-top h2 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(25px, 3vw, 34px);
    }

    .detail-lead { color: var(--muted); margin-top: 0; }

    .guide-list { padding-left: 22px; }

    .guide-list li { padding: 5px 0 5px 4px; }

    .tip-box {
      margin-top: 20px;
      padding: 16px 18px;
      border-left: 4px solid var(--blue);
      border-radius: 8px;
      background: #edf4ff;
    }

    .detail-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 25px;
    }

    .status {
      display: none;
      margin: 16px 0;
      padding: 12px 15px;
      border-radius: 10px;
      color: #17436c;
      background: #e6f3ff;
      font-size: 14px;
    }

    .status.visible { display: block; }

    .empty-state {
      display: none;
      padding: 20px;
      border-radius: 12px;
      background: white;
      color: var(--muted);
    }

    .place-image {
      display: grid;
      place-items: center;
      min-height: 130px;
      margin-bottom: 14px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2d83c6, #102a43);
      font-size: 45px;
    }

    .place-category {
      display: inline-block;
      margin-bottom: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      color: #1454a1;
      background: #e9f2ff;
      font-size: 12px;
      font-weight: 800;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .contact-form { display: grid; gap: 12px; }

    .contact-form label {
      font-size: 14px;
      font-weight: 700;
    }

    .contact-form input,
    .contact-form textarea {
      display: block;
      width: 100%;
      margin-top: 5px;
      padding: 12px 13px;
      border: 1px solid #d4dfeb;
      border-radius: 10px;
      background: #fff;
      color: var(--text);
    }

    .contact-form textarea {
      min-height: 115px;
      resize: vertical;
    }

    .small-note { color: var(--muted); font-size: 13px; }

    footer {
      padding: 32px 5%;
      background: var(--navy-deep);
      color: #dbe7f4;
    }

    .footer-inner {
      width: min(1180px, 100%);
      margin: auto;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    footer p { margin: 5px 0; font-size: 14px; }

    footer a { color: var(--gold); text-decoration: none; }

    .back-to-top {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 50;
      display: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--blue);
      color: white;
      box-shadow: 0 5px 20px rgba(0,0,0,.2);
    }

    .back-to-top.visible { display: block; }

    :focus-visible {
      outline: 3px solid #f59e0b;
      outline-offset: 3px;
    }

    @media (max-width: 850px) {
      .hero-inner {
        grid-template-columns: 1fr;
        gap: 25px;
        padding: 60px 0;
      }

      .hero-aside { max-width: 580px; }

      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 620px) {
      .site-header {
        padding: 11px 5%;
        flex-wrap: wrap;
      }

      .menu-toggle { display: inline-flex; }

      .nav-links {
        display: none;
        width: 100%;
        align-items: stretch;
        flex-direction: column;
        gap: 4px;
      }

      .nav-links.open { display: flex; }

      .nav-links a { padding: 10px 12px; }

      .hero-inner { padding: 48px 0; }

      .hero-copy { font-size: 16px; }

      .search-box { flex-direction: column; }

      .search-box .btn { width: 100%; }

      .container { padding: 35px 0; }

      .grid, .about-grid { grid-template-columns: 1fr; }

      .section-heading {
        align-items: flex-start;
        flex-direction: column;
      }

      .card { padding: 21px; }

      .detail-actions .btn { flex: 1 1 100%; }
    }
  </style>
</head>
<body>
