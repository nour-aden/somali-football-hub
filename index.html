<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Istanbul Furniture Management System</title>
<meta name="theme-color" content="#4a2f20">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--brand:#4a2f20;--brand2:#6b4430;--accent:#c8832a;--gold:#e8b05a;--bg:#f5f1ea;--card:#fff;--ink:#241810;--mut:#7a6a5d;--line:#e6ddd0;--ok:#2f7d4f;--warn:#c8832a;--bad:#b3392f;--info:#2c6aa0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0 0 .6rem;line-height:1.2}h1{font-size:1.35rem}h2{font-size:1.15rem}h3{font-size:1rem;margin-top:1rem}
a{color:var(--brand2)}
.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;display:flex;align-items:center;gap:.6rem;padding:.55rem .8rem;padding-top:calc(.55rem + env(safe-area-inset-top))}
.top .burger{background:none;border:0;color:#fff;font-size:1.6rem;line-height:1;padding:.2rem .4rem;cursor:pointer}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:700}.brand svg{width:30px;height:30px}
#title{margin-left:auto;font-size:.85rem;opacity:.8}
#nav{position:fixed;z-index:30;top:0;bottom:0;left:0;width:250px;background:var(--brand);color:#fff;transform:translateX(-100%);transition:transform .2s;overflow-y:auto;padding:1rem .6rem}
#nav .nb{display:flex;align-items:center;gap:.6rem;margin:.2rem .4rem 1rem}#nav .nb svg{width:38px;height:38px}#nav .nb b{font-size:1rem;line-height:1.1}#nav .nb small{display:block;opacity:.7;font-weight:400}
#nav a{display:flex;gap:.7rem;align-items:center;padding:.7rem .8rem;border-radius:10px;color:#f1e6da;text-decoration:none;cursor:pointer}
#nav a.on{background:var(--accent);color:#fff;font-weight:600}
#scrim{display:none;position:fixed;inset:0;background:#0007;z-index:25}
body.nav-open #nav{transform:none}body.nav-open #scrim{display:block}
main{padding:.9rem;max-width:1100px;margin:0 auto;padding-bottom:5rem}
@media(min-width:900px){#nav{transform:none}.top .burger{display:none}.top{padding-left:270px}main{margin-left:250px;max-width:none;padding:1.2rem 1.5rem}#scrim{display:none!important}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem;margin-bottom:.9rem}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin-bottom:.9rem}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.8rem;border-left:5px solid var(--accent)}
.kpi small{color:var(--mut);display:block}.kpi b{font-size:1.15rem;display:block;word-break:break-word}
.kpi.g{border-left-color:var(--ok)}.kpi.r{border-left-color:var(--bad)}.kpi.b{border-left-color:var(--info)}
.two{display:grid;gap:.9rem}@media(min-width:900px){.two{grid-template-columns:1fr 1fr}}
.bar{display:flex;gap:.5rem;margin-bottom:.7rem;align-items:center}
.bar input{flex:1;min-width:0}
input,select,textarea{width:100%;padding:.6rem .7rem;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:42px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--accent)}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:.6rem 1rem;font-weight:600;cursor:pointer;white-space:nowrap;min-height:42px}
.btn:active{opacity:.8}.btn.acc{background:var(--accent)}.btn.ghost{background:#efe7db;color:var(--brand)}.btn.red{background:var(--bad)}.btn.sm{padding:.35rem .7rem;min-height:34px;font-size:.85rem}
.row{display:flex;justify-content:space-between;gap:.6rem;align-items:center;padding:.7rem .8rem;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:.5rem;cursor:pointer}
.row small{display:block;color:var(--mut)}.row .r{text-align:right;flex-shrink:0}
.row:hover{border-color:var(--accent)}
.badge{display:inline-block;padding:.1rem .55rem;border-radius:99px;font-size:.75rem;font-weight:600;background:#eee;color:#444}
.s-New{background:#dbeafe;color:#1d4ed8}.s-In\ Production{background:#fef3c7;color:#92400e}.s-Ready{background:#dcfce7;color:#166534}.s-Delivered{background:#e5e7eb;color:#374151}.s-Cancelled{background:#fee2e2;color:#991b1b}
.low{background:#fee2e2;color:#991b1b}.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:1.5rem .5rem}
#modal{display:none;position:fixed;inset:0;z-index:50;background:#000a;overflow-y:auto}
#modal.show{display:block}
.mc{min-height:100%;display:flex;align-items:flex-start;justify-content:center;padding:.6rem}
.mcard{background:#fff;border-radius:14px;width:100%;max-width:640px;padding:1rem;margin:.5rem 0 2rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}.grid .w2{grid-column:1/-1}
.f{display:block}.f span{display:block;font-size:.8rem;color:var(--mut);margin-bottom:.15rem}
.acts{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem;flex-wrap:wrap}
.item{border:1px solid var(--line);border-radius:12px;padding:.6rem;margin-bottom:.5rem;background:#faf7f2;display:grid;gap:.4rem}
.item .r3{display:grid;grid-template-columns:1fr 1.4fr 1.4fr;gap:.4rem}
.tot{text-align:right;font-size:1.1rem;margin-top:.6rem}
table{width:100%;border-collapse:collapse}th,td{padding:.45rem .4rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:.78rem;color:var(--mut);text-transform:uppercase}
td.n,th.n{text-align:right}.tw{overflow-x:auto}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{padding:.3rem .7rem;border-radius:99px;background:#efe7db;font-size:.85rem}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:.6rem 1rem;border-radius:10px;z-index:99;display:none;max-width:90%}
.doc{color:#111;font-size:14px}
.doc .hd{display:flex;justify-content:space-between;gap:1rem;border-bottom:3px solid var(--brand);padding-bottom:.6rem;margin-bottom:.8rem;flex-wrap:wrap}
.doc .hd .l{display:flex;gap:.6rem;align-items:center}.doc .hd svg{width:52px;height:52px}
.doc .ttl{font-size:1.5rem;font-weight:800;color:var(--brand);text-align:right}
.doc .tt td{border:0;padding:.15rem .4rem}
.doc .big{font-size:1.2rem;font-weight:800}
.bars{width:100%;height:auto}
.legend{display:flex;gap:1rem;font-size:.8rem;color:var(--mut)}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.pre{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.6rem}
@media print{
 body{background:#fff}#app,#toast{display:none!important}
 #modal{position:static;background:none;display:block;overflow:visible}.mc{padding:0;display:block}.mcard{box-shadow:none;max-width:none;padding:0;margin:0}.no-print{display:none!important}
}
   </style>
</head>
<body>
<div id="app">
  <header class="top"><button class="burger" aria-label="Menu" onclick="A.menu()">☰</button><div class="brand" id="topbrand"></div><span id="title"></span></header>
  <nav id="nav"></nav><div id="scrim" onclick="A.menu(false)"></div>
  <main id="view"><div class="empty">Loading…</div></main>
</div>
<div id="modal"></div><div id="toast"></div>

<script>
/* ============ Istanbul Furniture Management System ============ */
const LOGO='<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><rect width="48" height="48" rx="10" fill="#4a2f20"/><rect x="12" y="7" width="24" height="32" rx="2" fill="none" stroke="#e8b05a" stroke-width="3"/><rect x="17" y="12" width="14" height="10" fill="#e8b05a" opacity=".35"/><circle cx="31" cy="27" r="2" fill="#e8b05a"/><path d="M8 43h32" stroke="#e8b05a" stroke-width="3" stroke-linecap="round"/></svg>';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>parseFloat(v)||0;
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const fmt=n=>'ETB '+num(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const dAgo=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const fd=s=>{if(!s)return '—';const d=new Date(s+'T00:00:00');return isNaN(d)?s:d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})};
const pad=n=>String(n).padStart(4,'0');
const CATS=['Wooden Door','Metal Door','Aluminium Door','Aluminium Window','Bed','Wardrobe','Cupboard','Custom Furniture','Other'];
const ECATS=['Raw Materials','Wages / Salaries','Rent','Electricity & Water','Transport','Tools & Equipment','Marketing','Maintenance','Other'];
const METHODS=['Cash','Telebirr','CBE Birr','Bank Transfer','Other'];
const STATUSES=['New','In Production','Ready','Delivered','Cancelled'];
const DEF_CFG={id:1,name:'Istanbul Furniture',tagline:'Doors • Windows • Beds • Wardrobes • Custom Furniture',phone:'',address:'Jijiga, Somali Region, Ethiopia',tin:'',footer:'Thank you for your business! Goods once delivered are non-returnable.'};

/* ---------- database (IndexedDB) ---------- */
const STORES=['products','customers','orders','payments','expenses','materials','suppliers','stockmoves','settings'];
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('istanbul_fms',1);
  r.onupgradeneeded=()=>{STORES.forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id',autoIncrement:true})})};
  r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const st=(s,m)=>db.transaction(s,m||'readonly').objectStore(s);
const DB={all:s=>rq(st(s).getAll()),get:(s,id)=>rq(st(s).get(id)),put:(s,o)=>rq(st(s,'readwrite').put(o)),del:(s,id)=>rq(st(s,'readwrite').delete(id)),clear:s=>rq(st(s,'readwrite').clear())};
async function load(){const D={};for(const s of STORES)D[s]=await DB.all(s);D.cfg=Object.assign({},DEF_CFG,D.settings[0]||{});
  D.cust=Object.fromEntries(D.customers.map(c=>[c.id,c]));D.paidBy={};D.payments.forEach(p=>D.paidBy[p.orderId]=(D.paidBy[p.orderId]||0)+num(p.amount));
  D.orders.forEach(o=>{o.total=oTotal(o);o.paid=D.paidBy[o.id]||0;o.balance=o.total-o.paid});return D}
const oTotal=o=>Math.max(0,sum(o.items||[],i=>num(i.qty)*num(i.price))-num(o.discount));
const oCost=o=>sum(o.items||[],i=>num(i.qty)*num(i.cost));
const cname=(D,id)=>D.cust[id]?D.cust[id].name:'(deleted customer)';

/* ---------- ui helpers ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
function modal(h){$('#modal').innerHTML='<div class="mc"><div class="mcard">'+h+'</div></div>';$('#modal').classList.add('show');$('#modal').scrollTop=0}
function closeModal(){$('#modal').classList.remove('show');$('#modal').innerHTML=''}
const badge=s=>`<span class="badge s-${esc(s)}">${esc(s)}</span>`;
const row=(click,t,sub,r,rsub,s)=>`<div class="row" role="button" onclick="${click}" data-s="${esc((s||t+' '+sub).toLowerCase())}"><div><b>${t}</b><small>${sub||''}</small></div><div class="r"><b>${r||''}</b><small>${rsub||''}</small></div></div>`;
const bar=(ph,btn,fn)=>`<div class="bar"><input type="search" placeholder="${ph}" oninput="A.filter(this.value)">${btn?`<button class="btn acc" onclick="${fn}">${btn}</button>`:''}</div>`;
const none=t=>`<div class="empty">${t}</div>`;
function form(title,fields,vals,onSave,extra){
  vals=vals||{};
  const h=fields.map(f=>{const v=vals[f.k]!=null?vals[f.k]:(f.def!=null?f.def:'');let i;
    if(f.t==='select')i=`<select name="${f.k}">${f.o.map(o=>{const a=Array.isArray(o)?o:[o,o];return `<option value="${esc(a[0])}" ${String(a[0])===String(v)?'selected':''}>${esc(a[1])}</option>`}).join('')}</select>`;
    else if(f.t==='textarea')i=`<textarea name="${f.k}" rows="2">${esc(v)}</textarea>`;
    else i=`<input name="${f.k}" type="${f.t||'text'}" value="${esc(v)}" ${f.t==='number'?'step="any" inputmode="decimal"':''} ${f.req?'required':''} ${f.ph?`placeholder="${esc(f.ph)}"`:''}>`;
    return `<label class="f ${f.w||''}"><span>${f.l}${f.req?' *':''}</span>${i}</label>`}).join('');
  modal(`<form id="frm"><h2>${title}</h2><div class="grid">${h}</div>${extra||''}<div class="acts"><button type="button" class="btn ghost" onclick="A.close()">Cancel</button><button class="btn">Save</button></div></form>`);
  $('#frm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const o={};
    fields.forEach(x=>{let v=f.get(x.k);if(x.t==='number')v=(v===''||v==null)?'':num(v);o[x.k]=v});
    await onSave(o)};
}

/* ---------- pages ---------- */
function pDash(D){
  const m=today().slice(0,7),live=D.orders.filter(o=>o.status!=='Cancelled');
  const mo=live.filter(o=>(o.date||'').startsWith(m));
  const sales=sum(mo,o=>o.total),exp=sum(D.expenses.filter(e=>(e.date||'').startsWith(m)),e=>num(e.amount));
  const coll=sum(D.payments.filter(p=>(p.date||'').startsWith(m)),p=>num(p.amount));
  const out=sum(live,o=>o.balance>0?o.balance:0),profit=sales-exp;
  const active=D.orders.filter(o=>['New','In Production','Ready'].includes(o.status));
  const cnt=Object.fromEntries(STATUSES.map(s=>[s,D.orders.filter(o=>o.status===s).length]));
  const up=active.slice().sort((a,b)=>(a.deliveryDate||'9')<(b.deliveryDate||'9')?-1:1).slice(0,5);
  const low=D.materials.filter(x=>num(x.qty)<=num(x.minQty));
  const recent=D.orders.slice().sort((a,b)=>b.id-a.id).slice(0,5);
  // 6-month chart
  const ms=[];const n=new Date();for(let i=5;i>=0;i--){const x=new Date(n.getFullYear(),n.getMonth()-i,1);ms.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'))}
  const sv=ms.map(k=>sum(live.filter(o=>(o.date||'').startsWith(k)),o=>o.total)),ev=ms.map(k=>sum(D.expenses.filter(e=>(e.date||'').startsWith(k)),e=>num(e.amount)));
  const mx=Math.max(1,...sv,...ev);let svg='<svg class="bars" viewBox="0 0 600 220">';
  ms.forEach((k,i)=>{const x=20+i*95,h1=sv[i]/mx*150,h2=ev[i]/mx*150;
    svg+=`<rect x="${x}" y="${180-h1}" width="34" height="${h1}" rx="3" fill="#c8832a"/><rect x="${x+38}" y="${180-h2}" width="34" height="${h2}" rx="3" fill="#4a2f20"/><text x="${x+36}" y="200" font-size="13" text-anchor="middle" fill="#7a6a5d">${new Date(k+'-01T00:00:00').toLocaleDateString('en-GB',{month:'short'})}</text>`});
  svg+='<line x1="10" x2="590" y1="180" y2="180" stroke="#e6ddd0"/></svg>';
  const empty=!D.orders.length&&!D.products.length?`<div class="card"><b>Welcome!</b><p class="mut">Start by adding products, or load sample data to explore the system.</p><button class="btn acc" onclick="A.seed()">Load sample data</button></div>`:'';
  return `${empty}<div class="kpis">
   <div class="kpi"><small>Sales this month</small><b>${fmt(sales)}</b></div>
   <div class="kpi r"><small>Expenses this month</small><b>${fmt(exp)}</b></div>
   <div class="kpi ${profit>=0?'g':'r'}"><small>Est. profit (month)</small><b>${fmt(profit)}</b></div>
   <div class="kpi b"><small>Collected this month</small><b>${fmt(coll)}</b></div>
   <div class="kpi r"><small>Outstanding balances</small><b>${fmt(out)}</b></div>
   <div class="kpi"><small>Active orders</small><b>${active.length}</b></div>
   <div class="kpi g"><small>Delivered</small><b>${cnt.Delivered}</b></div>
   <div class="kpi ${low.length?'r':'g'}"><small>Low-stock items</small><b>${low.length}</b></div></div>
  <div class="card"><h2>Sales vs expenses — last 6 months</h2>${svg}<div class="legend"><span><i style="background:#c8832a"></i>Sales</span><span><i style="background:#4a2f20"></i>Expenses</span></div></div>
  <div class="card"><h2>Orders by status</h2><div class="chips">${STATUSES.map(s=>`<span class="chip">${badge(s)} <b>${cnt[s]}</b></span>`).join('')}</div></div>
  <div class="two"><div><h2>Upcoming deliveries</h2>${up.length?up.map(o=>row(`A.go('orders/${o.id}')`,`#${pad(o.id)} · ${esc(cname(D,o.customerId))}`,`Due ${fd(o.deliveryDate)}${o.deliveryDate&&o.deliveryDate<today()?' <span class="bad">· overdue</span>':''}`,badge(o.status),o.balance>0?`<span class="bad">Due ${fmt(o.balance)}</span>`:'<span class="ok">Paid</span>')).join(''):none('No active orders')}</div>
  <div><h2>Low stock alerts</h2>${low.length?low.map(x=>row(`A.go('inventory')`,esc(x.name),`Min ${num(x.minQty)} ${esc(x.unit)}`,`<span class="badge low">${num(x.qty)} ${esc(x.unit)}</span>`,'')).join(''):none('All materials sufficiently stocked')}</div></div>
  <h2 style="margin-top:.9rem">Recent orders</h2>${recent.length?recent.map(o=>orderRow(D,o)).join(''):none('No orders yet')}`;
                    }
   const orderRow=(D,o)=>row(`A.go('orders/${o.id}')`,`#${pad(o.id)} · ${esc(cname(D,o.customerId))}`,`${fd(o.date)} · ${esc((o.items||[]).map(i=>i.name).join(', ')).slice(0,60)}`,fmt(o.total),`${badge(o.status)} ${o.status==='Cancelled'?'':o.balance>0?`<span class="bad">Bal ${fmt(o.balance)}</span>`:'<span class="ok">Paid</span>'}`,`${o.id} ${cname(D,o.customerId)} ${o.status} ${(o.items||[]).map(i=>i.name).join(' ')}`);

function pProducts(D){
  const l=D.products.slice().sort((a,b)=>a.name.localeCompare(b.name));
  return `<h1>Products</h1>${bar('Search products…','+ Product','A.product()')}${l.length?l.map(p=>{const mg=num(p.price)-num(p.cost);return row(`A.product(${p.id})`,esc(p.name),`${esc(p.category)} · cost ${fmt(p.cost)}`,fmt(p.price)+(p.unit&&p.unit!=='pcs'?' / '+esc(p.unit):''),`<span class="${mg>=0?'ok':'bad'}">Margin ${fmt(mg)}${num(p.price)?` (${Math.round(mg/num(p.price)*100)}%)`:''}</span>`,p.name+' '+p.category)}).join(''):none('No products yet. Tap “+ Product”.')}`;
}
function pCustomers(D){
  const l=D.customers.slice().sort((a,b)=>a.name.localeCompare(b.name));
  return `<h1>Customers</h1>${bar('Search name or phone…','+ Customer','A.customer()')}${l.length?l.map(c=>{const os=D.orders.filter(o=>o.customerId===c.id&&o.status!=='Cancelled');return row(`A.go('customers/${c.id}')`,esc(c.name),esc(c.phone||'No phone')+(c.address?' · '+esc(c.address):''),os.length+' order'+(os.length===1?'':'s'),sum(os,o=>o.balance)>0?`<span class="bad">Owes ${fmt(sum(os,o=>o.balance))}</span>`:'',c.name+' '+c.phone)}).join(''):none('No customers yet.')}`;
}
function pCustomer(D,id){
  const c=D.cust[id];if(!c)return none('Customer not found');
  const os=D.orders.filter(o=>o.customerId===id).sort((a,b)=>b.id-a.id),live=os.filter(o=>o.status!=='Cancelled');
  return `<p><a href="#/customers">← Customers</a></p><div class="card"><h2>${esc(c.name)}</h2><p>📞 ${esc(c.phone||'—')}<br>📍 ${esc(c.address||'—')}<br>${esc(c.notes||'')}</p>
   <div class="chips"><span class="chip">Orders <b>${live.length}</b></span><span class="chip">Total <b>${fmt(sum(live,o=>o.total))}</b></span><span class="chip">Paid <b>${fmt(sum(live,o=>o.paid))}</b></span><span class="chip">Balance <b class="bad">${fmt(sum(live,o=>o.balance))}</b></span></div>
   <div class="acts" style="justify-content:flex-start"><button class="btn acc" onclick="A.order(null,${c.id})">+ New order</button><button class="btn ghost" onclick="A.customer(${c.id})">Edit</button><button class="btn red" onclick="A.delCustomer(${c.id})">Delete</button></div></div>
   <h2>Order history</h2>${os.length?os.map(o=>orderRow(D,o)).join(''):none('No orders yet')}`;
}
function pOrders(D){
  const f=A.ofilter||'All';
  const l=D.orders.filter(o=>f==='All'||o.status===f).sort((a,b)=>b.id-a.id);
  return `<h1>Orders</h1><div class="pre">${['All',...STATUSES].map(s=>`<button class="btn sm ${s===f?'':'ghost'}" onclick="A.ofilter='${s}';A.render()">${s}</button>`).join('')}</div>${bar('Search orders, customers…','+ New order','A.order()')}${l.length?l.map(o=>orderRow(D,o)).join(''):none('No orders found.')}`;
}

    form('Record payment',[{k:'orderId',l:'Order',t:'select',w:'w2',o:open.map(o=>[o.id,`#${pad(o.id)} · ${cname(D,o.customerId)} · bal ${fmt(o.balance)}`]),def:sel.id},{k:'amount',l:'Amount (ETB)',t:'number',req:1,def:sel.balance},{k:'date',l:'Date',t:'date',def:today()},{k:'method',l:'Method',t:'select',o:METHODS},{k:'note',l:'Note'}],{orderId:sel.id},async o=>{
      o.orderId=+o.orderId;const ord=D.orders.find(x=>x.id===o.orderId);if(o.amount<=0)return alert('Enter an amount');
      if(o.amount>ord.balance+0.001&&!confirm('Amount is more than the balance due ('+fmt(ord.balance)+'). Continue?'))return;
      o.type=D.payments.some(p=>p.orderId===o.orderId)?(o.amount>=ord.balance?'Final payment':'Payment'):'Deposit';
      const id=await DB.put('payments',o);closeModal();toast('Payment recorded');await A.render();A.receipt(id)})},
  /* expenses */
  async expense(id){const D=await load();const e=id?await DB.get('expenses',id):{date:today()};
    form(id?'Edit expense':'New expense',[{k:'description',l:'Description',req:1,w:'w2',ph:'e.g. 20 sheets plywood'},{k:'amount',l:'Amount (ETB)',t:'number',req:1},{k:'date',l:'Date',t:'date',def:today()},{k:'category',l:'Category',t:'select',o:ECATS},{k:'method',l:'Paid by',t:'select',o:METHODS},{k:'supplierId',l:'Supplier (optional)',t:'select',w:'w2',o:[['','— None —'],...D.suppliers.map(s=>[s.id,s.name])]}],e,async o=>{o.supplierId=o.supplierId?+o.supplierId:'';if(id)o.id=id;await DB.put('expenses',o);closeModal();toast('Expense saved');A.render()},id?`<button type="button" class="btn red sm" onclick="A.del('expenses',${id})">Delete expense</button>`:'')},
  /* inventory */
  async material(id){const D=await load();const m=id?await DB.get('materials',id):{};
    form(id?'Edit material':'New material',[{k:'name',l:'Material',req:1,w:'w2',ph:'e.g. Plywood 18mm'},{k:'unit',l:'Unit',ph:'sheet, kg, m, pcs…',req:1},{k:'qty',l:'Quantity in stock',t:'number',def:0},{k:'minQty',l:'Minimum (alert level)',t:'number',def:0},{k:'unitCost',l:'Cost per unit (ETB)',t:'number',def:0},{k:'supplierId',l:'Supplier',t:'select',o:[['','— None —'],...D.suppliers.map(s=>[s.id,s.name])]}],m,async o=>{o.supplierId=o.supplierId?+o.supplierId:'';if(o.qty==='')o.qty=0;if(id)o.id=id;await DB.put('materials',o);closeModal();toast('Material saved');A.render()},id?`<button type="button" class="btn red sm" onclick="A.del('materials',${id},'Delete this material?')">Delete material</button>`:'')},
  async stock(id){const m=await DB.get('materials',id);
    form('Adjust stock — '+esc(m.name)+' (now '+num(m.qty)+' '+esc(m.unit)+')',[{k:'type',l:'Movement',t:'select',o:[['In','➕ Stock in (purchase)'],['Out','➖ Stock out (used)']]},{k:'qty',l:'Quantity ('+m.unit+')',t:'number',req:1},{k:'date',l:'Date',t:'date',def:today()},{k:'exp',l:'Record purchase as expense?',t:'select',o:[['','No'],['1','Yes (qty × unit cost)']]},{k:'note',l:'Note',w:'w2'}],{},async o=>{
      if(o.qty<=0)return alert('Enter a quantity');if(o.type==='Out'&&o.qty>num(m.qty)&&!confirm('This is more than the stock on hand. Set stock to 0?'))return;
      m.qty=o.type==='In'?num(m.qty)+o.qty:Math.max(0,num(m.qty)-o.qty);await DB.put('materials',m);
      await DB.put('stockmoves',{materialId:id,type:o.type,qty:o.qty,date:o.date,note:o.note});
      if(o.type==='In'&&o.exp==='1'&&num(m.unitCost)>0)await DB.put('expenses',{description:'Purchase: '+o.qty+' '+m.unit+' '+m.name,amount:o.qty*num(m.unitCost),date:o.date,category:'Raw Materials',method:'Cash',supplierId:m.supplierId||''});
      closeModal();toast('Stock updated');A.render()})},
         /* suppliers */
  async supplier(id){const s=id?await DB.get('suppliers',id):{};
    form(id?'Edit supplier':'New supplier',[{k:'name',l:'Supplier name',req:1,w:'w2'},{k:'phone',l:'Phone',t:'tel'},{k:'address',l:'Address / city'},{k:'supplies',l:'Supplies (what they sell)',w:'w2',ph:'Timber, hinges, aluminium profiles…'},{k:'notes',l:'Notes',t:'textarea',w:'w2'}],s,async o=>{if(id)o.id=id;await DB.put('suppliers',o);closeModal();toast('Supplier saved');A.render()},id?`<button type="button" class="btn red sm" onclick="A.del('suppliers',${id},'Delete this supplier?')">Delete supplier</button>`:'')},
  /* reports */
  preset(p){const n=new Date(),y=n.getFullYear(),m=n.getMonth();
    A.range=p==='month'?{from:iso(new Date(y,m,1)),to:today()}:p==='last'?{from:iso(new Date(y,m-1,1)),to:iso(new Date(y,m,0))}:p==='year'?{from:y+'-01-01',to:today()}:{from:'',to:''};A.render()},
  async csv(kind){const D=await load(),{from,to}=range(),inR=d=>(!from||(d||'')>=from)&&(!to||(d||'')<=to);let rows;
    if(kind==='orders')rows=[['Order','Date','Customer','Status','Total','Paid','Balance']].concat(D.orders.filter(o=>inR(o.date)).map(o=>[pad(o.id),o.date,cname(D,o.customerId),o.status,o.total,o.paid,o.balance]));
    else rows=[['Date','Category','Description','Amount','Method']].concat(D.expenses.filter(e=>inR(e.date)).map(e=>[e.date,e.category,e.description,e.amount,e.method||'']));
    A.download(rows.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\n'),kind+'-'+today()+'.csv','text/csv')},
  download(txt,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)},
  /* invoices & receipts */
  docHead(D,title,no,date){const c=D.cfg;return `<div class="hd"><div class="l">${LOGO}<div><b style="font-size:1.15rem">${esc(c.name)}</b><br><small>${esc(c.tagline)}</small><br><small>${esc(c.address)}${c.phone?' · Tel '+esc(c.phone):''}${c.tin?' · TIN '+esc(c.tin):''}</small></div></div><div><div class="ttl">${title}</div><div style="text-align:right">No. <b>${no}</b><br>Date: ${fd(date)}</div></div></div>`},
  async invoice(id){const D=await load(),o=D.orders.find(x=>x.id===id),c=D.cust[o.customerId]||{},pays=D.payments.filter(p=>p.orderId===id).sort((a,b)=>a.id-b.id),sub=sum(o.items,i=>num(i.qty)*num(i.price));
    modal(`<div class="doc">${A.docHead(D,'INVOICE','INV-'+pad(id),o.date)}<p><b>Bill to:</b> ${esc(c.name||'')}<br>${esc(c.phone||'')} ${esc(c.address||'')}<br>Delivery date: ${fd(o.deliveryDate)}</p>
     <div class="tw"><table><tr><th>#</th><th>Description</th><th class="n">Qty</th><th class="n">Unit price</th><th class="n">Amount</th></tr>${o.items.map((i,k)=>`<tr><td>${k+1}</td><td><b>${esc(i.name)}</b>${i.size?'<br><small>Size: '+esc(i.size)+'</small>':''}${i.notes?'<br><small>'+esc(i.notes)+'</small>':''}</td><td class="n">${num(i.qty)}</td><td class="n">${fmt(i.price)}</td><td class="n">${fmt(num(i.qty)*num(i.price))}</td></tr>`).join('')}</table></div>
     <table class="tt" style="width:auto;margin-left:auto;margin-top:.6rem"><tr><td>Subtotal</td><td class="n">${fmt(sub)}</td></tr>${num(o.discount)?`<tr><td>Discount</td><td class="n">− ${fmt(o.discount)}</td></tr>`:''}<tr><td><b>Total</b></td><td class="n"><b>${fmt(o.total)}</b></td></tr><tr><td>Paid</td><td class="n">${fmt(o.paid)}</td></tr><tr><td class="big">Balance due</td><td class="n big">${fmt(o.balance)}</td></tr></table>
     ${pays.length?`<p><b>Payments received</b><br>${pays.map(p=>`${fd(p.date)} — ${fmt(p.amount)} (${esc(p.method)}${p.type?', '+esc(p.type):''})`).join('<br>')}</p>`:''}
     <p style="border-top:1px solid #ccc;padding-top:.5rem;text-align:center"><small>${esc(D.cfg.footer)}</small></p>
     <div class="acts no-print"><button class="btn ghost" onclick="A.close()">Close</button><button class="btn" onclick="window.print()">🖨 Print / Save PDF</button></div></div>`)},
  async receipt(pid){const D=await load(),p=D.payments.find(x=>x.id===pid);if(!p)return;const o=D.orders.find(x=>x.id===p.orderId),c=D.cust[o.customerId]||{};
    const upto=sum(D.payments.filter(x=>x.orderId===o.id&&x.id<=pid),x=>num(x.amount)),bal=o.total-upto;
    modal(`<div class="doc">${A.docHead(D,'RECEIPT','RCT-'+pad(pid),p.date)}<p>Received from <b>${esc(c.name||'')}</b> ${esc(c.phone||'')}</p>
     <table class="tt"><tr><td>Amount received</td><td class="n big">${fmt(p.amount)}</td></tr><tr><td>Payment type</td><td class="n">${esc(p.type||'Payment')}</td></tr><tr><td>Method</td><td class="n">${esc(p.method)}</td></tr><tr><td>For order</td><td class="n">#${pad(o.id)} (${esc(o.items.map(i=>i.name).join(', ').slice(0,80))})</td></tr><tr><td>Order total</td><td class="n">${fmt(o.total)}</td></tr><tr><td>Total paid to date</td><td class="n">${fmt(upto)}</td></tr><tr><td><b>Balance remaining</b></td><td class="n"><b>${fmt(Math.max(0,bal))}</b></td></tr></table>
     ${p.note?`<p>Note: ${esc(p.note)}</p>`:''}<p style="margin-top:2rem">Received by: ______________________</p><p style="text-align:center"><small>${esc(D.cfg.footer)}</small></p>
     <div class="acts no-print"><button class="btn ghost" onclick="A.close()">Close</button><button class="btn" onclick="window.print()">🖨 Print / Save PDF</button></div></div>`)},
  /* data */
  async backup(){const o={app:'istanbul-fms',version:1,date:new Date().toISOString()};for(const s of STORES)o[s]=await DB.all(s);A.download(JSON.stringify(o),'istanbul-furniture-backup-'+today()+'.json','application/json');toast('Backup downloaded')},
  async restore(f){if(!f)return;try{const o=JSON.parse(await f.text());if(o.app!=='istanbul-fms')throw new Error('Not a valid backup file');if(!confirm('This replaces ALL current data with the backup. Continue?'))return;
      for(const s of STORES){await DB.clear(s);for(const r of (o[s]||[]))await DB.put(s,r)}toast('Backup restored');A.render()}catch(e){alert('Restore failed: '+e.message)}},
  async wipe(){if(confirm('Erase ALL data permanently? Download a backup first!')&&confirm('Are you absolutely sure?')){for(const s of STORES)await DB.clear(s);toast('All data erased');A.render()}},
  async cfgSave(e){e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.id=1;await DB.put('settings',o);toast('Settings saved');A.render()},
  async seed(){
    if((await DB.all('products')).length&&!confirm('Add sample data to your existing data?'))return;
    const P=[['Solid wood door 210x90','Wooden Door',18000,11000],['Steel security door','Metal Door',12500,7800],['Aluminium door with glass','Aluminium Door',9500,6000],['Aluminium sliding window','Aluminium Window',6500,4000],['Double bed (wood)','Bed',22000,14000],['3-door wardrobe','Wardrobe',28000,17500],['Kitchen cupboard (per set)','Cupboard',15000,9000],['Custom office desk','Custom Furniture',12000,7000]];
    const pid=[];for(const p of P)pid.push(await DB.put('products',{name:p[0],category:p[1],unit:'pcs',price:p[2],cost:p[3],notes:''}));
    const sid=[];for(const s of [['Jijiga Timber Market','+251 91 000 0001','Jijiga','Timber, plywood, MDF'],['Dire Dawa Metal & Aluminium','+251 91 000 0002','Dire Dawa','Steel sheets, aluminium profiles, glass'],['Hardware Plus','+251 91 000 0003','Jijiga','Hinges, locks, screws, paint']])sid.push(await DB.put('suppliers',{name:s[0],phone:s[1],address:s[2],supplies:s[3],notes:''}));
    for(const m of [['Plywood 18mm','sheet',24,10,2400,0],['Timber (Cedar)','m³',3,1,32000,0],['Steel sheet 1.5mm','sheet',8,10,3800,1],['Aluminium profile','bar',40,20,650,1],['Glass 5mm','m²',15,6,900,1],['Hinges (heavy)','pcs',60,30,85,2],['Door locks','pcs',9,10,450,2],['Varnish / paint','litre',18,8,320,2]])await DB.put('materials',{name:m[0],unit:m[1],qty:m[2],minQty:m[3],unitCost:m[4],supplierId:sid[m[5]]});
    const cid=[];for(const c of [['Abdi Mohamed','+251 91 111 2233','Jijiga, Kebele 03'],['Hodan Ahmed','+251 91 222 3344','Jijiga, Kebele 05'],['Abdullahi Yusuf','+251 91 333 4455','Degehabur'],['Fatuma Ali','+251 91 444 5566','Jijiga, Downtown']])cid.push(await DB.put('customers',{name:c[0],phone:c[1],address:c[2],notes:'',createdAt:today()}));
    const mk=async(ci,ago,del,status,items,disc,pays)=>{const its=items.map(([k,q,sz])=>({productId:pid[k],name:P[k][0],cat:P[k][1],qty:q,price:P[k][2],cost:P[k][3],size:sz||'',notes:''}));const id=await DB.put('orders',{customerId:cid[ci],date:dAgo(-ago),deliveryDate:dAgo(del),status,items:its,discount:disc,notes:'',createdAt:dAgo(-ago)});let n=0;for(const a of pays)await DB.put('payments',{orderId:id,amount:a,date:dAgo(-ago+n*7),method:METHODS[n%3],type:n?'Payment':'Deposit',note:''}),n++};
    await mk(0,70,-50,'Delivered',[[0,2,'210 × 90 cm']],0,[36000]);await mk(1,45,-20,'Delivered',[[5,1,'240 × 220 cm'],[4,1,'180 × 200 cm']],2000,[48000]);
    await mk(2,30,-5,'Delivered',[[1,2,'200 × 90 cm']],0,[15000,10000]);await mk(3,12,6,'In Production',[[3,4,'120 × 120 cm'],[2,1,'210 × 100 cm']],500,[15000]);
    await mk(0,6,10,'In Production',[[6,1,'Kitchen 3.5 m'],[7,1,'160 × 70 cm']],0,[10000]);await mk(1,2,14,'New',[[0,1,'220 × 100 cm']],0,[5000]);
    for(const e of [['Plywood & timber purchase',48000,'Raw Materials',-60],['Workshop rent',15000,'Rent',-35],['Workers salaries',42000,'Wages / Salaries',-33],['Aluminium profiles & glass',36000,'Raw Materials',-25],['Electricity',3200,'Electricity & Water',-20],['Workshop rent',15000,'Rent',-5],['Workers salaries',42000,'Wages / Salaries',-3],['Delivery truck rental',2500,'Transport',-2],['Hinges, locks, paint',9800,'Raw Materials',-8]])await DB.put('expenses',{description:e[0],amount:e[1],category:e[2],date:dAgo(e[3]),method:'Cash',supplierId:''});
    toast('Sample data loaded');A.go('dashboard');A.render()}
};
window.A=A;

/* ---------- start ---------- */
document.addEventListener('submit',e=>{if(e.target.id==='cfg')A.cfgSave(e)});
window.addEventListener('hashchange',()=>{closeModal();A.render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
openDB().then(()=>{A.render();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}).catch(e=>{$('#view').innerHTML='<div class="empty">Could not open the database: '+esc(e.message)+'<br>Private/incognito mode may block it.</div>'});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
