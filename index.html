<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Macalin Academy</title>
<meta name="description" content="Clear, friendly lessons in Mathematics, English, Science and Somali for students in grades 6, 7 and 8.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap">

<style>
/* Macalin Academy: styles (school look)
   Layout: navy top bar, white header, split hero with an illustrated student, a navy feature strip,
   then about, grade and subject cards, lessons, a navy numbers band, teachers with FAQ, a call to action,
   a newsletter bar and a navy footer.
   Palette: deep navy, school gold, warm cream. Serif headings, clean sans body. */

:root {
  --font-display: "Playfair Display", Georgia, "Times New Roman", serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --bg: #ffffff;
  --cream: #faf6ee;
  --surface: #ffffff;
  --surface-2: #eef2fa;
  --ink: #0e2350;
  --ink-2: #4b5878;
  --line: #dfe5f1;
  --navy: #0e2350;
  --navy-2: #163066;
  --on-navy: #ffffff;
  --brand: #0e2350;
  --brand-hover: #1a3a7c;
  --on-brand: #ffffff;
  --sun: #eba81c;
  --sun-hover: #d89708;
  --on-sun: #231800;
  --gold-text: #b97d05;
  --blob: #2b59c9;

  --math: #2565d8;
  --eng: #b9700a;
  --sci: #12856a;
  --som: #d24a3b;
  --g6: #2f7be8;
  --g7: #eba81c;
  --g8: #12a184;

  --header-bg: color-mix(in srgb, var(--surface) 94%, transparent);
  --shadow: 0 1px 2px rgba(14, 35, 80, 0.06), 0 10px 28px -14px rgba(14, 35, 80, 0.22);
  --shadow-lg: 0 2px 4px rgba(14, 35, 80, 0.08), 0 24px 48px -20px rgba(14, 35, 80, 0.35);

  --r-lg: 18px;
  --r-md: 12px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09132a;
    --cream: #0d1a36;
    --surface: #101d3b;
    --surface-2: #172850;
    --ink: #eaf0fc;
    --ink-2: #9db0d3;
    --line: #243a66;
    --navy: #07102a;
    --navy-2: #12224a;
    --brand: #eba81c;
    --brand-hover: #ffc247;
    --on-brand: #231800;
    --sun: #f2b632;
    --sun-hover: #ffc959;
    --gold-text: #f2b632;
    --blob: #3a6be0;
    --math: #6ea3ff;
    --eng: #f0b43c;
    --sci: #3fcaa3;
    --som: #ff8a7a;
    --g6: #6ea3ff;
    --g7: #f0b43c;
    --g8: #3fcaa3;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 28px -14px rgba(0, 0, 0, 0.6);
    --shadow-lg: 0 2px 4px rgba(0, 0, 0, 0.5), 0 24px 48px -20px rgba(0, 0, 0, 0.7);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #09132a;
  --cream: #0d1a36;
  --surface: #101d3b;
  --surface-2: #172850;
  --ink: #eaf0fc;
  --ink-2: #9db0d3;
  --line: #243a66;
  --navy: #07102a;
  --navy-2: #12224a;
  --brand: #eba81c;
  --brand-hover: #ffc247;
  --on-brand: #231800;
  --sun: #f2b632;
  --sun-hover: #ffc959;
  --gold-text: #f2b632;
  --blob: #3a6be0;
  --math: #6ea3ff;
  --eng: #f0b43c;
  --sci: #3fcaa3;
  --som: #ff8a7a;
  --g6: #6ea3ff;
  --g7: #f0b43c;
  --g8: #3fcaa3;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 28px -14px rgba(0, 0, 0, 0.6);
  --shadow-lg: 0 2px 4px rgba(0, 0, 0, 0.5), 0 24px 48px -20px rgba(0, 0, 0, 0.7);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 40;
  background: var(--navy);
}

h1, h2, h3 { margin: 0; text-wrap: balance; }
h1, h2 { font-family: var(--font-display); line-height: 1.12; letter-spacing: -0.01em; }
h3 { font-family: var(--font-body); line-height: 1.25; }
p { margin: 0; }
a { color: inherit; }
img { display: block; }
button, input { font: inherit; color: inherit; }
svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; border-radius: 6px; }

.wrap { width: 100%; max-width: 1200px; margin-inline: auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }

.skip { position: absolute; left: 16px; top: -60px; z-index: 60; background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 10px; text-decoration: none; }
.skip:focus { top: 12px; }

/* ---------- Top bar ---------- */
.topbar { background: var(--navy); color: #dbe5fb; font-size: 0.82rem; }
.topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; min-height: 40px; flex-wrap: wrap; }
.top-left, .top-right { display: flex; align-items: center; gap: 8px 22px; flex-wrap: wrap; min-width: 0; }
.top-left span, .top-link { display: inline-flex; align-items: center; gap: 8px; min-width: 0; overflow-wrap: anywhere; }
.top-left svg, .top-link svg { flex: none; width: 15px; height: 15px; color: var(--sun); }
.top-link { background: none; border: 0; cursor: pointer; padding: 8px 0; color: inherit; transition: color 0.2s; }
.top-link:hover { color: var(--sun); }

/* ---------- Header ---------- */
.site-header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: var(--header-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.header-row { display: flex; align-items: center; gap: 12px 22px; padding-block: 12px; flex-wrap: wrap; }
.brand { display: inline-flex; align-items: center; gap: 11px; text-decoration: none; margin-right: auto; }
.brand-mark { width: 44px; height: 46px; display: grid; place-items: center; background: var(--navy); color: var(--sun); border-radius: 10px 10px 22px 22px; border: 2px solid var(--sun); }
.brand-mark svg { width: 22px; height: 22px; fill: currentColor; stroke: none; }
.brand-text { display: grid; line-height: 1.05; }
.brand-text b { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; letter-spacing: 0.02em; color: var(--ink); }
.brand-text small { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.28em; color: var(--ink-2); }

.nav { display: flex; gap: 2px; }
.nav a { text-decoration: none; font-weight: 600; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); padding: 10px 12px; position: relative; }
.nav a::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 2px; height: 2px; background: var(--sun); transform: scaleX(0); transition: transform 0.25s; }
.nav a:hover::after, .nav a[aria-current="true"]::after { transform: scaleX(1); }

.search { position: relative; width: min(220px, 100%); }
.search input { width: 100%; height: 42px; padding: 0 14px 0 40px; border-radius: 10px; background: var(--surface); border: 1.5px solid var(--line); outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
.search input::placeholder { color: var(--ink-2); opacity: 0.85; }
.search input:focus { border-color: var(--sun); box-shadow: 0 0 0 4px color-mix(in srgb, var(--sun) 25%, transparent); }
.search-icon { position: absolute; left: 13px; top: 12px; width: 18px; height: 18px; color: var(--ink-2); pointer-events: none; }
.suggest { position: absolute; right: 0; top: calc(100% + 8px); z-index: 50; width: min(340px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow-lg); padding: 6px; display: grid; gap: 2px; }
.suggest button { display: grid; grid-template-columns: 10px 1fr; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; border: 0; background: none; border-radius: 8px; cursor: pointer; min-width: 0; }
.suggest button:hover, .suggest button:focus-visible { background: var(--surface-2); }
.suggest b { font-weight: 600; font-size: 0.95rem; overflow-wrap: anywhere; }
.suggest small { display: block; color: var(--ink-2); font-size: 0.8rem; }
.suggest .dot { width: 10px; height: 10px; border-radius: 50%; }
.suggest .none { padding: 12px; color: var(--ink-2); font-size: 0.9rem; }

.icon-btn { width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; transition: background 0.2s; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 20px; height: 20px; }
.menu-btn { display: none; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 24px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; font-weight: 700; font-size: 0.82rem; letter-spacing: 0.07em; text-transform: uppercase; text-decoration: none; line-height: 1.2; transition: transform 0.2s, background 0.2s, border-color 0.2s, color 0.2s; }
.btn svg { width: 17px; height: 17px; transition: transform 0.2s; }
.btn:hover svg { transform: translateX(3px); }
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--brand); color: var(--on-brand); }
.btn-primary:hover { background: var(--brand-hover); }
.btn-sun { background: var(--sun); color: var(--on-sun); }
.btn-sun:hover { background: var(--sun-hover); }
.btn-outline { background: transparent; border-color: var(--ink); color: var(--ink); }
.btn-outline:hover { background: var(--ink); color: var(--bg); }
.btn-ghost { background: var(--surface); border-color: var(--line); color: var(--ink); }
.btn-ghost:hover { border-color: var(--ink); }
.btn-small { padding: 9px 14px; font-size: 0.72rem; background: var(--surface-2); color: var(--ink); }
.btn-small:hover { background: var(--navy); color: #fff; }

/* ---------- Hero ---------- */
.hero { background: linear-gradient(180deg, var(--cream), var(--bg)); overflow: hidden; }
.hero-grid { display: grid; grid-template-columns: 1.02fr 1fr; align-items: center; gap: 24px 40px; padding-block: 48px 64px; }
.hero-copy { min-width: 0; display: grid; gap: 22px; justify-items: start; animation: rise 0.7s ease both; }
.eyebrow-pill { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold-text); }
h1 { font-size: clamp(2.6rem, 6.6vw, 4.6rem); font-weight: 700; color: var(--ink); }
h1 span { color: var(--gold-text); }
.lede { font-size: clamp(1.02rem, 2vw, 1.15rem); color: var(--ink-2); max-width: 32em; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; }

.hero-art { position: relative; justify-self: end; width: 100%; max-width: 540px; min-width: 0; }
.hero-scene img, .hero-scene svg { width: 100%; height: auto; display: block; }
.chip-float { position: absolute; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg); animation: float 7s ease-in-out infinite; }
.chip-float b { display: block; font-family: var(--font-display); font-size: 1.35rem; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
.chip-float span.t { font-size: 0.78rem; color: var(--ink-2); line-height: 1.2; display: block; }
.chip-float .ico { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--sun) 25%, var(--surface)); color: var(--gold-text); flex: none; }
.chip-float .ico svg { width: 22px; height: 22px; }
.cf-1 { left: -2%; top: 6%; }
.cf-2 { right: 0; bottom: 8%; animation-delay: -3s; }
@keyframes rise { from { transform: translateY(14px); } to { transform: none; } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
   
/* ---------- Feature strip ---------- */
.strip { margin-top: -28px; position: relative; z-index: 2; }
.strip-box { list-style: none; margin: 0; padding: 22px 26px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px 22px; background: var(--navy); color: #fff; border-radius: 16px; box-shadow: var(--shadow-lg); }
.strip-box li { display: flex; gap: 12px; align-items: flex-start; min-width: 0; padding-right: 8px; }
.strip-box li + li { border-left: 1px solid rgba(255, 255, 255, 0.14); padding-left: 20px; }
.strip-icon { flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--sun); color: var(--sun); }
.strip-icon svg { width: 21px; height: 21px; }
.strip-box h3 { font-size: 0.92rem; font-weight: 700; margin-bottom: 2px; }
.strip-box p { font-size: 0.78rem; color: #b8c7ea; line-height: 1.4; }

/* ---------- Sections ---------- */
section[id] { scroll-margin-top: 130px; }
.band { padding-block: 72px; }
.band-cream { background: var(--cream); }
.band-head { display: grid; gap: 10px; margin-bottom: 32px; max-width: 40em; }
.band-head.center { margin-inline: auto; text-align: center; justify-items: center; }
.eyebrow { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold-text); }
h2 { font-size: clamp(1.8rem, 4.2vw, 2.6rem); font-weight: 700; }
h2 span { color: var(--gold-text); }
.band-sub { color: var(--ink-2); }
.center-btn { display: flex; justify-content: center; margin-top: 32px; }
.split { display: grid; grid-template-columns: 1.25fr 1fr; gap: 48px; align-items: start; }
.split > * { min-width: 0; }

/* About */
.about-grid { display: grid; grid-template-columns: 1fr 1.1fr 0.5fr; gap: 28px; align-items: center; }
.about-grid > * { min-width: 0; }
.about-copy { display: grid; gap: 16px; justify-items: start; }
.about-copy p { color: var(--ink-2); }
.mini-stats { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 12px 26px; }
.mini-stats li { display: grid; }
.mini-stats b { font-family: var(--font-display); font-size: 1.7rem; line-height: 1.1; color: var(--ink); font-variant-numeric: tabular-nums; }
.mini-stats span { font-size: 0.78rem; color: var(--ink-2); }
.about-img { margin: 0; border-radius: 16px; overflow: hidden; box-shadow: var(--shadow-lg); }
.about-img img { width: 100%; height: auto; aspect-ratio: 600 / 440; object-fit: cover; }
.stat-cards { display: grid; gap: 14px; }
.stat-card { display: flex; align-items: center; gap: 14px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.stat-card svg { flex: none; width: 34px; height: 34px; color: var(--navy); stroke-width: 1.6; }
:root[data-theme="dark"] .stat-card svg { color: var(--sun); }
.stat-card .heart { color: var(--sun); fill: var(--sun); stroke: none; }
.stat-card b { display: block; font-family: var(--font-display); font-size: 1.45rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat-card span.t { font-size: 0.78rem; color: var(--ink-2); line-height: 1.25; display: block; }

/* Subject colour hooks */
[data-s="math"] { --sc: var(--math); }
[data-s="eng"] { --sc: var(--eng); }
[data-s="sci"] { --sc: var(--sci); }
[data-s="som"] { --sc: var(--som); }
