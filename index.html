<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Management System</title>
<meta name="description" content="School Management System for Ethiopian schools — students, attendance, exams, fees and reports.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Supabase JavaScript client (loaded from CDN, pinned version) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* =====================================================================
   DESIGN TOKENS
   ===================================================================== */
:root{
  --bg:#f4f6fb; --surface:#fff; --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8; --line:#e5e9f2;
  --blue:#2563eb; --blue-d:#1d4ed8; --blue-l:#eaf1ff; --navy:#0f2557; --navy2:#16336e;
  --green:#15803d; --green-l:#e6f6ec; --red:#dc2626; --red-l:#fdecec; --amber:#b45309; --amber-l:#fff3dc; --slate-l:#eef1f6;
  --radius:12px; --shadow:0 1px 2px rgba(15,23,42,.05),0 6px 20px rgba(15,23,42,.06);
  --side:260px; --top:64px;
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.no-scroll{overflow:hidden}
h1,h2,h3,h4{margin:0;line-height:1.25}
a{color:var(--blue);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.muted{color:var(--ink2)} .small{font-size:12px} .right{text-align:right} .center{text-align:center}
.mono{font-variant-numeric:tabular-nums}
.ic{flex:none;vertical-align:middle}

/* ---------- boot spinner ---------- */
.boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:200}
.spinner{width:34px;height:34px;border:3px solid var(--blue-l);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--slate-l)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-d)}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.busy{position:relative;color:transparent!important;pointer-events:none}
.btn.busy::after{content:"";position:absolute;width:16px;height:16px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.btn:not(.btn-primary):not(.btn-danger).busy::after{border-color:var(--line);border-top-color:var(--blue)}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:9px;border:0;background:transparent;color:var(--ink2);cursor:pointer;position:relative}
.icon-btn:hover{background:var(--slate-l);color:var(--ink)}
.icon-btn.danger:hover{background:var(--red-l);color:var(--red)}
.dot{position:absolute;top:4px;right:3px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}

/* ---------- forms ---------- */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fg{display:flex;flex-direction:column;gap:5px;min-width:0}
.fg.full{grid-column:1/-1}
.fg>label,.lbl{font-size:12.5px;font-weight:600;color:var(--ink2)}
.fg .req{color:var(--red)}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=date],input[type=month],input[type=search],select,textarea{
  width:100%;height:38px;padding:0 12px;border:1px solid #d5dbe8;border-radius:9px;background:#fff;outline:none;transition:.15s}
textarea{height:auto;padding:10px 12px;min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
input:disabled,select:disabled{background:var(--slate-l);color:var(--ink2)}
.check{display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer}
.check input{width:16px;height:16px}
.help{font-size:12px;color:var(--ink3)}
.section-title{grid-column:1/-1;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-top:6px;border-top:1px solid var(--line);padding-top:14px}
   /* ---------- auth ---------- */
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.auth-brand{background:linear-gradient(150deg,var(--navy) 0%,#1e4ba8 100%);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between}
.auth-brand h1{font-size:34px;font-weight:700;letter-spacing:-.02em;max-width:460px}
.auth-brand p{color:#c7d6f5;max-width:440px;font-size:15px}
.auth-feats{display:grid;gap:12px;margin-top:28px}
.auth-feats div{display:flex;gap:10px;align-items:center;color:#dbe6ff}
.auth-side{display:grid;place-items:center;padding:28px;background:#fff;position:relative}
.auth-card{width:100%;max-width:380px}
.auth-card h2{font-size:24px;margin-bottom:6px}
.auth-card form{display:grid;gap:14px;margin-top:22px}
.auth-lang{position:absolute;top:18px;right:18px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.logo-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.35)}
.alert{padding:10px 12px;border-radius:9px;font-size:13px;border:1px solid}
.alert.err{background:var(--red-l);border-color:#f5c2c2;color:#991b1b}
.alert.ok{background:var(--green-l);border-color:#bfe5cc;color:var(--green)}
.alert.warn{background:var(--amber-l);border-color:#f3d9a4;color:var(--amber)}

/* ---------- app shell ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--navy);color:#cbd8f6;display:flex;flex-direction:column;z-index:60;transition:transform .25s}
.sidebar .brand{height:var(--top);display:flex;align-items:center;gap:10px;padding:0 20px;color:#fff;font-weight:700;font-size:16px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar .brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar nav{padding:14px 12px;display:grid;gap:3px;overflow-y:auto;flex:1;align-content:start}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:#cbd8f6;font-weight:500;position:relative}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:rgba(255,255,255,.13);color:#fff}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:#60a5fa}
.side-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#93a8d6}
.scrim{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:55}
.main{margin-left:var(--side);min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;height:var(--top);background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px;z-index:40}
.topbar .title{font-weight:700;font-size:16px;white-space:nowrap}
.topbar .grow{flex:1}
.hamburger{display:none}
.gsearch{position:relative;width:280px}
.gsearch .search input{height:36px}
.view{padding:24px;max-width:1500px;width:100%;margin:0 auto;flex:1}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:22px;letter-spacing:-.01em}
.page-head p{margin:2px 0 0;color:var(--ink2)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--slate-l);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:7px;font-weight:600;font-size:12px;cursor:pointer;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.12)}
   /* ---------- menus ---------- */
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:240px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px rgba(15,23,42,.16);padding:6px;z-index:80}
.menu.wide{width:340px}
.menu-head{padding:10px 12px;border-bottom:1px solid var(--line);margin:-6px -6px 6px}
.menu-item{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;padding:9px 12px;border-radius:8px;cursor:pointer;text-align:left;color:var(--ink)}
.menu-item:hover{background:var(--slate-l)}
.menu-item.danger{color:var(--red)}
.notif{display:flex;gap:10px;padding:10px 12px;border-radius:8px;color:var(--ink);align-items:flex-start}
.notif:hover{background:var(--slate-l)}
.notif .ni{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.pop{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px rgba(15,23,42,.16);padding:6px;z-index:80;max-height:320px;overflow:auto}
.pop button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left}
.pop button:hover{background:var(--slate-l)}

/* ---------- cards / stats ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-head h3{font-size:15px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin-bottom:18px}
.stat{display:flex;gap:14px;align-items:center;padding:18px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.stat-ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none}
.tone-blue{background:var(--blue-l);color:var(--blue)} .tone-green{background:var(--green-l);color:var(--green)}
.tone-red{background:var(--red-l);color:var(--red)} .tone-amber{background:var(--amber-l);color:var(--amber)} .tone-slate{background:var(--slate-l);color:var(--ink2)}
.stat-v{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.stat-l{color:var(--ink2);font-size:12.5px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
.grid-main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-bottom:16px}

/* ---------- charts ---------- */
.bars{display:flex;align-items:flex-end;gap:10px;height:200px;padding:14px 8px 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bar-stack{width:100%;max-width:46px;display:flex;flex-direction:column-reverse;border-radius:7px 7px 0 0;overflow:hidden;background:var(--slate-l);min-height:3px}
.bar-stack i{display:block}
.bar-lab{font-size:11px;color:var(--ink2);margin-top:6px;white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
.c-present{--c:#2563eb;background:#2563eb}.c-absent{--c:#ef4444;background:#ef4444}.c-late{--c:#f59e0b;background:#f59e0b}.c-excused{--c:#94a3b8;background:#94a3b8}
.hbar{display:grid;grid-template-columns:90px 1fr 40px;gap:10px;align-items:center;margin:9px 0;font-size:12.5px}
.hbar .track{height:9px;background:var(--slate-l);border-radius:6px;overflow:hidden}
.hbar .fill{height:100%;background:linear-gradient(90deg,#3b82f6,#2563eb);border-radius:6px}
.split{display:flex;height:12px;border-radius:7px;overflow:hidden;background:var(--slate-l);margin:10px 0}
 /* ---------- tables ---------- */
.table-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);text-align:left;font-weight:600;padding:11px 16px;background:#f8fafd;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:hover{background:#fafcff}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:700;background:#f8fafd}
.cell-user{display:flex;align-items:center;gap:11px;min-width:0}
.cell-user b{display:block;font-weight:600}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:84px;height:84px;font-size:26px;border-radius:18px}
.row-actions{display:flex;gap:2px;justify-content:flex-end}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-green{background:var(--green-l);color:var(--green)}.b-red{background:var(--red-l);color:var(--red)}.b-amber{background:var(--amber-l);color:var(--amber)}.b-blue{background:var(--blue-l);color:var(--blue-d)}.b-gray{background:var(--slate-l);color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--slate-l);border-radius:7px;padding:2px 8px;font-size:12px;color:var(--ink2);border:0}
button.chip{cursor:pointer}button.chip:hover{background:var(--blue-l);color:var(--blue)}
.empty{padding:46px 20px;text-align:center;color:var(--ink2)}
.empty .ic{color:var(--ink3);width:38px;height:38px;margin-bottom:8px}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,#eef1f6 25%,#f8fafc 37%,#eef1f6 63%);background-size:400% 100%;animation:sh 1.3s infinite;margin:16px}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ---------- filters / tabs / pager ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line);align-items:center}
.filters select,.filters input[type=date],.filters input[type=month]{width:auto;min-width:140px}
.search{position:relative;flex:1;min-width:200px;max-width:340px}
.search .ic{position:absolute;left:11px;top:10px;color:var(--ink3);pointer-events:none}
.search input{padding-left:34px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:10px 14px;border:0;background:none;font-weight:600;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--blue);border-color:var(--blue)}
.pager{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;gap:8px}
.pager-btns{display:flex;gap:10px;align-items:center}
   /* ---------- attendance ---------- */
.att-status{display:inline-flex;gap:4px;flex-wrap:wrap}
.att-status label{cursor:pointer}
.att-status input{position:absolute;opacity:0;pointer-events:none}
.att-status span{display:inline-block;padding:5px 10px;border-radius:8px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink2);background:#fff;user-select:none}
.att-status input:checked+span.s-present{background:#2563eb;color:#fff;border-color:#2563eb}
.att-status input:checked+span.s-absent{background:#ef4444;color:#fff;border-color:#ef4444}
.att-status input:checked+span.s-late{background:#f59e0b;color:#fff;border-color:#f59e0b}
.att-status input:checked+span.s-excused{background:#64748b;color:#fff;border-color:#64748b}
.att-status input:disabled+span{opacity:.6;cursor:not-allowed}
.att-note{min-width:150px}
.summary-row{display:flex;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.pill{padding:6px 12px;border-radius:10px;background:var(--slate-l);font-weight:600;font-size:12.5px}
.sticky-foot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 18px;display:flex;justify-content:flex-end;gap:10px;border-radius:0 0 var(--radius) var(--radius)}
.mark-input{width:96px!important;text-align:right}
.mark-input.bad{border-color:var(--red);background:var(--red-l)}

/* ---------- modal / toast ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto;z-index:100;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:16px;width:100%;max-width:640px;box-shadow:0 24px 60px rgba(15,23,42,.3);animation:pop .18s}
.modal.sm{max-width:420px}.modal.lg{max-width:900px}.modal.xl{max-width:1100px}
@keyframes pop{from{transform:translateY(10px);opacity:.4}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:17px}
.modal-body{padding:20px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);grid-column:1/-1}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px}
.kv div small{display:block;color:var(--ink3);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
#toast-root{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:300;max-width:calc(100vw - 32px)}
.toast{display:flex;gap:10px;align-items:flex-start;background:#0f172a;color:#fff;padding:12px 14px;border-radius:11px;box-shadow:0 10px 30px rgba(0,0,0,.3);min-width:260px;max-width:420px;animation:pop .2s}
.toast.error{background:#991b1b}.toast.success{background:#166534}.toast.warn{background:#92400e}

.asg{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center}
@media (max-width:640px){.asg{grid-template-columns:1fr 1fr}}
/* ---------- printing ---------- */
#print-root{display:none}
.sheet{font-family:'Inter',Arial,sans-serif;color:#000;font-size:12px}
.sheet h1{font-size:20px;margin:0}.sheet h2{font-size:15px;margin:2px 0 10px}
.sheet .lh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #1d4ed8;padding-bottom:10px;margin-bottom:14px;gap:14px}
.sheet table{width:100%;border-collapse:collapse;margin:8px 0}
.sheet th,.sheet td{border:1px solid #bbb;padding:5px 8px;text-align:left}
.sheet th{background:#eef3fc}.sheet td.num,.sheet th.num{text-align:right}
.sheet .sum{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0}
.sheet .sign{display:flex;justify-content:space-between;margin-top:46px}.sheet .sign div{border-top:1px solid #000;padding-top:4px;width:30%;text-align:center}
.sheet.page{page-break-after:always}
@media print{
  body.printing{background:#fff}
  body.printing > *:not(#print-root){display:none!important}
  body.printing #print-root{display:block!important}
  @page{margin:14mm}
                                           }
